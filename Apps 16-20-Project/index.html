<script>
const APPS=[{"n": 16, "name": "BuildTrack AI", "html": "<!DOCTYPE html>\n<html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\n<title>BuildTrack AI - Construction Intelligence<\/title><style>:root{--bg:#ecebe6;--ink:#262626;--y:#ffc400;--card:#fff;--red:#d64531;--amb:#e59a00;--grn:#2e8b57;--mut:#6d6a63;--line:#d4d1c8}\n*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 \"Segoe UI\",system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}\nh1,h2{margin:0;font-family:\"Arial Narrow\",\"Segoe UI\",sans-serif;text-transform:none}h1{font-size:1.5rem}h2{font-size:1rem;margin-bottom:8px}small{font-weight:400;color:var(--mut)}\n:focus-visible{outline:3px solid var(--ink);outline-offset:2px}\n.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:12px 20px;background:var(--y);border-bottom:6px solid var(--ink);background-image:repeating-linear-gradient(135deg,transparent 0 14px,rgba(0,0,0,.05) 14px 28px)}\n.demo{background:var(--ink);color:var(--y);padding:3px 10px;font-weight:700;font-size:.75rem}.wk{margin-left:auto;font-weight:700}\n.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;padding:14px 20px}.k{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--y);padding:8px 12px}.k.bad{border-left-color:var(--red)}.k b{display:block;font:700 1.6rem \"Arial Narrow\",sans-serif}.k span{font-size:.78rem;color:var(--mut)}\nmain{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:0 20px 20px}.c{background:var(--card);border:1px solid var(--line);padding:14px;min-width:0}.wide{grid-column:span 2}.ai{grid-column:1/-1}.state{padding:12px;color:var(--mut)}\ninput,select,button,summary{font:inherit}input,select,button{padding:7px 10px;border:1px solid #bbb;background:#fff}button{cursor:pointer}button:hover{background:#f6f0d6}\n.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}.tools input{flex:1;min-width:150px}summary{cursor:pointer;margin-top:10px;font-weight:600}.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px;margin-top:8px}.form button{background:var(--ink);color:var(--y);border:0;font-weight:700}\n.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}.pc{border:1px solid var(--line);border-top:5px solid var(--grn);padding:10px;background:#faf9f5}.pc.Medium{border-top-color:var(--amb)}.pc.High{border-top-color:var(--red)}.pc[aria-current=true]{box-shadow:0 0 0 2px var(--ink)}\n.pc h3{margin:0;font-size:.95rem}.badge{font-size:.72rem;padding:1px 8px;background:var(--line);font-weight:700}.badge.High{background:var(--red);color:#fff}.badge.Medium{background:var(--amb);color:#fff}\n.bar{height:8px;background:var(--line);margin:4px 0}.bar i{display:block;height:100%;background:var(--ink)}.pc input[type=range]{width:100%;padding:0}.pc button{margin-top:4px;font-size:.8rem}\n.rm{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.rc{min-height:58px;padding:3px;font-size:.72rem}.r0{background:#cfe8d6}.r1{background:#f6e3b0}.r2{background:#efb7ad}.rc span{display:inline-block;background:var(--ink);color:#fff;padding:0 5px;margin:1px;border-radius:8px}\n.g{position:relative;margin-bottom:8px}.gl{font-size:.78rem}.gt{position:relative;height:16px;background:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 4.1666%)}.gb{position:absolute;top:2px;height:12px;background:#bfb9a3}.gb i{display:block;height:100%;background:var(--y);border-right:2px solid var(--ink)}.td{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--red)}\n.board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.col{background:#f4f2ec;padding:8px;min-height:80px}.col h3{margin:0 0 6px;font-size:.85rem}.tk{background:#fff;border:1px solid var(--line);border-left:4px solid var(--amb);padding:6px;margin-bottom:6px;font-size:.82rem}.tk.over{border-left-color:var(--red)}.tk button{padding:0 8px;margin:3px 3px 0 0;font-size:.75rem}\n.brow{font-size:.82rem}.mini{list-style:none;margin:0 0 10px;padding:0}.mini li{padding:5px 8px;border-left:4px solid var(--y);background:#f4f2ec;margin-bottom:4px;font-size:.85rem}.mini li.bad{border-color:var(--red)}\n.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.out{border-left:5px solid var(--y);background:#f4f2ec;padding:10px 12px;white-space:pre-line}\n.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--y);padding:8px 18px;z-index:5}\n@media(max-width:1000px){main{grid-template-columns:1fr 1fr}}\n@media(max-width:620px){main{grid-template-columns:1fr;padding:0 12px 16px}.wide{grid-column:auto}.board{grid-template-columns:1fr}.kpis,.top{padding-left:12px;padding-right:12px}}\n<\/style><\/head>\n<body>\n<header class=\"top\"><h1>BuildTrack AI<\/h1><span class=\"demo\">DEMO DATA - fictional projects<\/span><span class=\"wk\">Week 12<\/span><\/header>\n<section class=\"kpis\" id=\"kpis\" aria-label=\"Key figures\"><\/section>\n<div id=\"state\" class=\"state\" role=\"status\">Loading project data...<\/div>\n<main id=\"main\" hidden>\n<section class=\"c wide\"><h2>Projects<\/h2><div class=\"tools\"><input id=\"q\" type=\"search\" placeholder=\"Search projects\" aria-label=\"Search projects\"><select id=\"f\" aria-label=\"Filter risk\"><option value=\"\">All risk levels<\/option><option>High<\/option><option>Medium<\/option><option>Low<\/option><\/select><select id=\"s\" aria-label=\"Sort\"><option value=\"risk\">Sort: risk<\/option><option value=\"prog\">Sort: progress<\/option><option value=\"name\">Sort: name<\/option><\/select><\/div><div id=\"cards\" class=\"cards\"><\/div><p id=\"empty\" class=\"state\" hidden>No projects match. Clear the search or choose \"All risk levels\".<\/p>\n<details><summary>Add project<\/summary><div class=\"form\"><input id=\"pn\" placeholder=\"Project name\" aria-label=\"Project name\"><input id=\"pb\" type=\"number\" placeholder=\"Budget (thousands)\" aria-label=\"Budget\"><input id=\"ps\" type=\"number\" placeholder=\"Start week\" aria-label=\"Start week\"><input id=\"pe\" type=\"number\" placeholder=\"End week\" aria-label=\"End week\"><button id=\"pa\">Add project<\/button><\/div><\/details><\/section>\n<section class=\"c\"><h2>Risk matrix<\/h2><div id=\"rm\" class=\"rm\"><\/div><\/section>\n<section class=\"c wide\"><h2>Gantt timeline<\/h2><div id=\"gantt\"><\/div><\/section>\n<section class=\"c\"><h2>Budget used<\/h2><div id=\"bud\"><\/div><\/section>\n<section class=\"c wide\"><h2>Task board <small id=\"bf\"><\/small><\/h2><div id=\"board\" class=\"board\"><\/div>\n<details><summary>Add task<\/summary><div class=\"form\"><input id=\"tn\" placeholder=\"Task name\" aria-label=\"Task name\"><select id=\"tp\" aria-label=\"Project\"><\/select><input id=\"td\" type=\"number\" placeholder=\"Due week\" aria-label=\"Due week\"><select id=\"tr\" aria-label=\"Priority\"><option>High<\/option><option selected>Medium<\/option><option>Low<\/option><\/select><button id=\"ta\">Add task<\/button><\/div><\/details><\/section>\n<section class=\"c\"><h2>Materials &amp; safety<\/h2><ul id=\"mat\" class=\"mini\"><\/ul><h2>Activity<\/h2><ul id=\"act\" class=\"mini\"><\/ul><\/section>\n<section class=\"c ai\"><h2>Site copilot<\/h2><div id=\"chips\" class=\"chips\"><\/div><div id=\"out\" class=\"out\">Pick a question.<\/div><\/section>\n<\/main>\n<div id=\"toast\" class=\"toast\" role=\"alert\" hidden><\/div>\n<script>// DEMO construction data. Fictional projects. Budget in thousands.\nconst CW=12; // current week\nconst PROJECTS0=[\n{id:\"A\",name:\"Project A - Riverside Tower\",mgr:\"R. Mehta\",start:2,end:20,budget:6200,spent:3900,prog:48},\n{id:\"B\",name:\"Project B - Metro Depot Shed\",mgr:\"S. Alvarez\",start:5,end:16,budget:2400,spent:1100,prog:42},\n{id:\"C\",name:\"Project C - Harbor Warehouse\",mgr:\"T. Okoye\",start:0,end:14,budget:1500,spent:1380,prog:78},\n{id:\"D\",name:\"Project D - Campus Library Wing\",mgr:\"L. Chen\",start:8,end:24,budget:3100,spent:300,prog:12}];\nconst TASKS0=[\n{id:1,p:\"A\",n:\"Pour level 6 slab\",st:\"Doing\",due:11,pri:\"High\"},{id:2,p:\"A\",n:\"Steel delivery inspection\",st:\"Todo\",due:10,pri:\"High\"},\n{id:3,p:\"A\",n:\"Install facade anchors\",st:\"Todo\",due:15,pri:\"Medium\"},{id:4,p:\"B\",n:\"Foundation curing check\",st:\"Done\",due:9,pri:\"Medium\"},\n{id:5,p:\"B\",n:\"Roof truss assembly\",st:\"Doing\",due:13,pri:\"High\"},{id:6,p:\"C\",n:\"Electrical fit-out\",st:\"Doing\",due:12,pri:\"Medium\"},\n{id:7,p:\"C\",n:\"Final safety audit\",st:\"Todo\",due:14,pri:\"High\"},{id:8,p:\"D\",n:\"Site survey\",st:\"Done\",due:9,pri:\"Low\"},{id:9,p:\"D\",n:\"Excavation start\",st:\"Todo\",due:11,pri:\"Medium\"}];\nconst MATERIALS=[[\"Steel rebar\",\"Low stock\"],[\"Concrete mix\",\"OK\"],[\"Bricks\",\"OK\"],[\"Glass panels\",\"Delayed\"]];\n<\/script><script>const $=id=>document.getElementById(id);\nlet P=PROJECTS0,T=TASKS0,sel=\"A\";\ntry{P=JSON.parse(localStorage.getItem(\"bt_p\")||\"null\")||PROJECTS0;T=JSON.parse(localStorage.getItem(\"bt_t\")||\"null\")||TASKS0}catch(e){}\nconst save=()=>{try{localStorage.setItem(\"bt_p\",JSON.stringify(P));localStorage.setItem(\"bt_t\",JSON.stringify(T))}catch(e){}};\nfunction toast(t){const e=$(\"toast\");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2000)}\nfunction act(t,bad){const li=document.createElement(\"li\");if(bad)li.className=\"bad\";li.textContent=`Week ${CW}: ${t}`;$(\"act\").prepend(li);while($(\"act\").children.length>6)$(\"act\").lastChild.remove()}\nconst exp=p=>Math.max(0,Math.min(1,(CW-p.start)/(p.end-p.start)))*100;\nconst late=p=>T.filter(t=>t.p===p.id&&t.st!==\"Done\"&&t.due<CW).length;\nconst delay=p=>Math.max(0,exp(p)-p.prog);\nconst over=p=>Math.max(0,p.spent/p.budget*100-p.prog);\nconst rs=p=>Math.round(delay(p)*.6+over(p)*.4+late(p)*5);\nconst lvl=p=>{const r=rs(p);return r>=20?\"High\":r>=8?\"Medium\":\"Low\"};\nfunction kpis(){const act=P.length,hi=P.filter(p=>lvl(p)===\"High\").length,tb=P.reduce((a,p)=>a+p.budget,0),ts=P.reduce((a,p)=>a+p.spent,0),pr=act?Math.round(P.reduce((a,p)=>a+p.prog,0)/act):0,dl=T.filter(t=>t.st!==\"Done\"&&t.due<CW).length;\n $(\"kpis\").innerHTML=[[\"Active projects\",act],[\"At risk (high)\",hi,hi>0],[\"Overall completion\",pr+\"%\"],[\"Budget used\",tb?Math.round(ts/tb*100)+\"%\":\"0%\"],[\"Delayed tasks\",dl,dl>0],[\"Material alerts\",MATERIALS.filter(m=>m[1]!==\"OK\").length,1]].map(k=>`<div class=\"k ${k[2]?\"bad\":\"\"}\"><b>${k[1]}<\/b><span>${k[0]}<\/span><\/div>`).join(\"\")}\nfunction cards(){const q=$(\"q\").value.toLowerCase(),f=$(\"f\").value,s=$(\"s\").value;let l=P.filter(p=>(!f||lvl(p)===f)&&p.name.toLowerCase().includes(q));\n l.sort(s===\"risk\"?(a,b)=>rs(b)-rs(a):s===\"prog\"?(a,b)=>b.prog-a.prog:(a,b)=>a.name.localeCompare(b.name));$(\"empty\").hidden=l.length>0;\n $(\"cards\").innerHTML=l.map(p=>`<div class=\"pc ${lvl(p)}\" aria-current=\"${p.id===sel}\"><h3>${p.name}<\/h3><small>${p.mgr}<\/small> <span class=\"badge ${lvl(p)}\">${lvl(p)} risk<\/span><div class=\"bar\" title=\"${p.prog}%\"><i style=\"width:${p.prog}%\"><\/i><\/div><label>Progress ${p.prog}%<input type=\"range\" min=\"0\" max=\"100\" value=\"${p.prog}\" data-p=\"${p.id}\" aria-label=\"Update progress for ${p.name}\"><\/label><button data-s=\"${p.id}\">Show tasks<\/button><\/div>`).join(\"\")}\n$(\"cards\").oninput=e=>{if(e.target.dataset.p){const p=P.find(x=>x.id===e.target.dataset.p);p.prog=+e.target.value;save();e.target.parentNode.firstChild.textContent=\"Progress \"+p.prog+\"%\"}};\n$(\"cards\").onchange=e=>{if(e.target.dataset.p){const p=P.find(x=>x.id===e.target.dataset.p);act(`${p.name.split(\" - \")[0]} progress set to ${p.prog}%`);toast(\"Progress updated\");refresh()}};\n$(\"cards\").onclick=e=>{if(e.target.dataset.s){sel=e.target.dataset.s;refresh()}};\n[\"q\",\"f\",\"s\"].forEach(i=>$(i).addEventListener(\"input\",cards));\nfunction matrix(){const c=[[],[],[],[],[],[],[],[],[]];P.forEach(p=>{const L=delay(p)>15?2:delay(p)>5?1:0,I=p.budget>=5000?2:p.budget>=2000?1:0;c[(2-I)*3+L].push(p.id)});\n $(\"rm\").innerHTML=c.map((a,i)=>`<div class=\"rc r${Math.min(2,(2-Math.floor(i/3))+(i%3)>=3?2:(2-Math.floor(i/3))+(i%3)>=2?1:0)}\">${a.map(x=>`<span>${x}<\/span>`).join(\"\")}<\/div>`).join(\"\")+'<small style=\"grid-column:1/-1\">Across: schedule slip. Up: budget impact.<\/small>'}\nfunction gantt(){$(\"gantt\").innerHTML=P.map(p=>`<div class=\"g\"><div class=\"gl\">${p.name} <small>wk ${p.start}-${p.end}<\/small><\/div><div class=\"gt\"><div class=\"gb\" style=\"left:${p.start/24*100}%;width:${(p.end-p.start)/24*100}%\"><i style=\"width:${p.prog}%\"><\/i><\/div><div class=\"td\" style=\"left:${CW/24*100}%\" title=\"Today\"><\/div><\/div><\/div>`).join(\"\")}\nfunction bud(){$(\"bud\").innerHTML=P.map(p=>{const u=Math.round(p.spent/p.budget*100);return`<div class=\"brow\">${p.id}: ${u}% of $${p.budget}k<div class=\"bar\"><i style=\"width:${Math.min(100,u)}%;background:${u>p.prog+15?\"var(--red)\":\"var(--ink)\"}\"><\/i><\/div><\/div>`}).join(\"\")}\nfunction board(){const l=T.filter(t=>t.p===sel);$(\"bf\").textContent=\"- \"+(P.find(p=>p.id===sel)||{name:\"none\"}).name;\n $(\"board\").innerHTML=[\"Todo\",\"Doing\",\"Done\"].map((c,ci)=>`<div class=\"col\"><h3>${c}<\/h3>${l.filter(t=>t.st===c).map(t=>`<div class=\"tk ${t.st!==\"Done\"&&t.due<CW?\"over\":\"\"}\">${t.n}<br><small>${t.pri}, due wk ${t.due}<\/small><br>${ci>0?`<button data-t=\"${t.id}\" data-d=\"-1\" aria-label=\"Move ${t.n} back\">Back<\/button>`:\"\"}${ci<2?`<button data-t=\"${t.id}\" data-d=\"1\" aria-label=\"Move ${t.n} forward\">Next<\/button>`:\"\"}<\/div>`).join(\"\")||'<small>No tasks<\/small>'}<\/div>`).join(\"\")}\n$(\"board\").onclick=e=>{const id=e.target.dataset.t;if(!id)return;const t=T.find(x=>x.id==id),o=[\"Todo\",\"Doing\",\"Done\"];t.st=o[o.indexOf(t.st)+ +e.target.dataset.d];save();act(`\"${t.n}\" moved to ${t.st}`);toast(\"Task moved\");refresh()};\n$(\"ta\").onclick=()=>{const n=$(\"tn\").value.trim(),d=+$(\"td\").value;if(!n||!d){toast(\"Enter a task name and due week\");return}T.push({id:Date.now(),p:$(\"tp\").value,n,st:\"Todo\",due:d,pri:$(\"tr\").value});save();act(`Task added: ${n}`);$(\"tn\").value=\"\";toast(\"Task added\");refresh()};\n$(\"pa\").onclick=()=>{const n=$(\"pn\").value.trim(),b=+$(\"pb\").value,s=+$(\"ps\").value,e=+$(\"pe\").value;if(!n||!b||e<=s){toast(\"Enter name, budget, and an end week after the start\");return}const id=\"N\"+P.length;P.push({id,name:n,mgr:\"Unassigned\",start:s,end:e,budget:b,spent:0,prog:0});sel=id;save();act(\"Project added: \"+n);[\"pn\",\"pb\",\"ps\",\"pe\"].forEach(i=>$(i).value=\"\");toast(\"Project added\");fillSel();refresh()};\nfunction fillSel(){$(\"tp\").innerHTML=\"\";P.forEach(p=>$(\"tp\").add(new Option(p.name,p.id)))}\nfunction mat(){$(\"mat\").innerHTML=MATERIALS.map(m=>`<li class=\"${m[1]===\"OK\"?\"\":\"bad\"}\">${m[0]}: ${m[1]}<\/li>`).join(\"\")}\nfunction refresh(){kpis();cards();matrix();gantt();bud();board()}\nfunction ai(k){const r=[...P].sort((a,b)=>rs(b)-rs(a)),w=r[0],p=P.find(x=>x.id===sel)||w;\n if(k==0)return`${w.name} is at highest risk (score ${rs(w)}): ${Math.round(delay(w))} points behind schedule, ${late(w)} overdue tasks, budget ${Math.round(w.spent/w.budget*100)}% used at ${w.prog}% progress.`;\n if(k==1)return`${p.name}: expected ${Math.round(exp(p))}% done by week ${CW}, actual ${p.prog}% (${Math.round(delay(p))} behind). ${late(p)} overdue task(s). ${MATERIALS.filter(m=>m[1]!==\"OK\").map(m=>m[0]+\" \"+m[1].toLowerCase()).join(\", \")} may contribute.`;\n if(k==2){const o=T.filter(t=>t.st!==\"Done\").sort((a,b)=>(rs(P.find(x=>x.id===b.p))-rs(P.find(x=>x.id===a.p)))||(a.due-b.due))[0];return o?`Prioritize \"${o.n}\" (${o.pri}, due week ${o.due}) in ${P.find(x=>x.id===o.p).name}.`:\"All tasks are done.\"}\n return`${P.length} projects, ${P.filter(x=>lvl(x)===\"High\").length} high risk, ${Math.round(P.reduce((a,x)=>a+x.prog,0)/P.length)}% average completion, ${T.filter(t=>t.st!==\"Done\"&&t.due<CW).length} overdue tasks. (Demo data.)`}\n$(\"chips\").innerHTML=[\"Which project is at risk?\",\"Why is the selected project delayed?\",\"Which task should be prioritized?\",\"Summarize construction progress.\"].map((x,i)=>`<button data-i=\"${i}\">${x}<\/button>`).join(\"\");\n$(\"chips\").onclick=e=>{if(e.target.dataset.i)$(\"out\").textContent=ai(+e.target.dataset.i)};\nsetTimeout(()=>{if(location.search.includes(\"error\")){$(\"state\").innerHTML='Could not load project data. <button onclick=\"location.href=location.pathname\">Retry<\/button>';return}\n $(\"state\").hidden=true;$(\"main\").hidden=false;fillSel();mat();act(\"Project data loaded\");act(\"Steel rebar stock is low\",1);refresh()},700);\n<\/script><\/body><\/html>\n"}, {"n": 17, "name": "MuseAI", "html": "<!DOCTYPE html>\n<html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\n<title>MuseAI - Creative Idea Studio<\/title><style>:root{--bg:#fbf7f0;--ink:#241b2f;--pink:#ff4f8b;--line:#e4dccd}\n*{box-sizing:border-box}html,body{height:100%;margin:0;padding-top:env(safe-area-inset-top,0)}\nbody{background:var(--bg);color:var(--ink);font:16px/1.4 \"Trebuchet MS\",\"Segoe UI\",sans-serif;overflow:hidden}\n:focus-visible{outline:3px solid var(--pink);outline-offset:2px}\n.load{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:9;font:italic 1.6rem Georgia,serif;transition:opacity .5s}\n.tools{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:12px;z-index:5;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:#fff;border:2px solid var(--ink);border-radius:40px;padding:6px 12px;box-shadow:4px 4px 0 var(--ink)}\n.logo{font:700 1.3rem Georgia,serif;color:var(--pink);margin-right:4px}.demo{font-size:.72rem;color:#7a6d85}\nbutton{font:inherit;cursor:pointer;border:2px solid var(--ink);background:#fff;border-radius:20px;padding:4px 12px}button:hover{background:#ffe3ee}\n#board{position:absolute;inset:0;overflow:auto;background-image:radial-gradient(#d9cfbd 1.3px,transparent 1.3px);background-size:24px 24px;padding-bottom:env(safe-area-inset-bottom,0)}\n.empty{position:absolute;top:40%;left:0;right:360px;text-align:center;font:italic 1.3rem Georgia,serif;color:#9a8da8;padding:0 20px}\n.card{position:absolute;width:190px;min-height:120px;border:2px solid var(--ink);border-radius:6px 18px 6px 18px;box-shadow:4px 4px 0 var(--ink);animation:pop .25s}\n.card .h{display:flex;justify-content:space-between;padding:4px 6px;cursor:grab;touch-action:none;border-bottom:2px dashed rgba(36,27,47,.35)}\n.card .h button{padding:0 7px;font-size:.8rem;border-width:1px}.card .t{padding:8px 10px;min-height:70px;outline:none;white-space:pre-wrap}\n.sw{display:flex;height:46px;margin:6px 10px}.sw i{flex:1}.sec{position:absolute;border:3px dashed #b8a9cc;border-radius:22px;min-width:260px;min-height:180px;resize:both;overflow:hidden}\n.sec .h{cursor:grab;touch-action:none;padding:6px 14px;font:700 1rem Georgia,serif;display:flex;justify-content:space-between}.sec .t{outline:none}\n@keyframes pop{from{transform:scale(.8) rotate(-3deg);opacity:0}}\n.muse{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:340px;max-height:70vh;background:#fff;border:2px solid var(--ink);border-radius:20px;box-shadow:5px 5px 0 var(--pink);padding:12px;display:flex;flex-direction:column;z-index:6}\n.chat{overflow:auto;display:grid;gap:8px;margin-bottom:8px;min-height:60px}.m{padding:8px 12px;border-radius:14px;font-size:.92rem}.m.u{background:var(--ink);color:#fff;justify-self:end}.m.a{background:#f3ecff}\n.m .pin{margin-top:6px;font-size:.8rem;background:var(--pink);color:#fff;border-color:var(--pink)}\n.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}.chips button{font-size:.76rem;padding:2px 9px}.ask{display:flex;gap:6px}\ninput{flex:1;font:inherit;padding:6px 10px;border:2px solid var(--ink);border-radius:20px;min-width:0}\n.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 18px;border-radius:20px;z-index:10}\n@media(max-width:800px){.muse{width:auto;left:12px;max-height:45vh}.empty{right:0;top:30%}.demo{display:none}}\n@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}\n<\/style><\/head>\n<body>\n<div id=\"load\" class=\"load\">Warming up the studio...<\/div>\n<nav class=\"tools\" aria-label=\"Board tools\">\n<b class=\"logo\">Muse<\/b>\n<button id=\"addCard\" title=\"Add idea card\">+ Idea<\/button>\n<button id=\"addSec\" title=\"Add section\">+ Section<\/button>\n<button id=\"clear\" title=\"Clear board\">Clear<\/button>\n<span class=\"demo\">DEMO ideas, generated locally<\/span><\/nav>\n<main id=\"board\" aria-label=\"Creative canvas\"><p id=\"empty\" class=\"empty\" hidden>An empty canvas. Add an idea card, or ask Muse for campaign ideas.<\/p><\/main>\n<aside class=\"muse\" id=\"muse\"><div id=\"chat\" class=\"chat\" aria-live=\"polite\"><\/div>\n<div class=\"chips\" id=\"chips\"><\/div>\n<div class=\"ask\"><input id=\"ai\" placeholder=\"Ask Muse for ideas...\" aria-label=\"Ask Muse\"><button id=\"send\">Go<\/button><\/div><\/aside>\n<div id=\"toast\" class=\"toast\" role=\"alert\" hidden><\/div>\n<script>// DEMO generators - ideas are templated, not from a live model.\nconst COLORS=[\"#ffd166\",\"#ff8fab\",\"#8ecae6\",\"#b8f2a8\",\"#cdb4ff\",\"#ffb38a\"];\nconst MOODS={futuristic:[\"#0b1026\",\"#5eead4\",\"#a78bfa\",\"#f0abfc\",\"#f8fafc\"],warm:[\"#3d1f14\",\"#e76f51\",\"#f4a261\",\"#e9c46a\",\"#fff4e0\"],calm:[\"#16324f\",\"#4d908e\",\"#90be6d\",\"#f9c74f\",\"#f1f7ed\"],bold:[\"#111827\",\"#ef233c\",\"#ffd60a\",\"#00b4d8\",\"#ffffff\"]};\nconst FONTS=[[\"Fraunces\",\"Inter\",\"Editorial warmth with a clean workhorse\"],[\"Space Grotesk\",\"IBM Plex Sans\",\"Technical but friendly\"],[\"Playfair Display\",\"Source Sans 3\",\"Classic contrast for premium brands\"],[\"Syne\",\"DM Sans\",\"Expressive headlines for youth brands\"]];\nconst ANGLES=[\"Flip the audience: let them make the ad\",\"A 7-day mystery countdown\",\"Street-style posters with a hidden QR\",\"Behind-the-scenes diary series\",\"Before/after reveal reel\",\"Community takeover day\",\"One bold word, one color, everywhere\",\"Collectible sticker drops\"];\nconst FEST=[\"Neon Roots: a night where tradition meets glow-in-the-dark art\",\"Echo Fest: every stage reacts to crowd noise\",\"Parallel Campus: swap departments for a day of workshops\",\"Midnight Bazaar: student founders sell, demo and perform\"];\n<\/script><script>const $=id=>document.getElementById(id),board=$(\"board\");\nlet S;try{S=JSON.parse(localStorage.getItem(\"muse\")||\"null\")}catch(e){S=null}\nS=S||{cards:[{id:1,x:60,y:110,t:\"Idea: a poster series made only of one bold word\",c:COLORS[0]},{id:2,x:300,y:170,t:\"Moodboard: neon + paper textures\",c:COLORS[1]}],secs:[]};\nconst save=()=>{try{localStorage.setItem(\"muse\",JSON.stringify(S))}catch(e){}};\nconst uid=()=>Date.now()+Math.random();\nfunction toast(t){const e=$(\"toast\");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2000)}\nfunction drag(el,h,obj){h.addEventListener(\"pointerdown\",e=>{if(e.target.tagName===\"BUTTON\")return;h.setPointerCapture(e.pointerId);\n const dx=e.clientX-obj.x,dy=e.clientY-obj.y;\n h.onpointermove=m=>{obj.x=Math.max(0,m.clientX-dx);obj.y=Math.max(60,m.clientY-dy);el.style.left=obj.x+\"px\";el.style.top=obj.y+\"px\"};\n h.onpointerup=()=>{h.onpointermove=null;save()}})}\nfunction render(){board.querySelectorAll(\".card,.sec\").forEach(n=>n.remove());\n S.secs.forEach(s=>{const d=document.createElement(\"div\");d.className=\"sec\";d.style.cssText=`left:${s.x}px;top:${s.y}px;width:${s.w}px;height:${s.h}px;background:${s.c}55`;\n  d.innerHTML=`<div class=\"h\"><span class=\"t\" contenteditable=\"true\" aria-label=\"Section title\">${s.t}<\/span><button aria-label=\"Delete section\">x<\/button><\/div>`;\n  d.querySelector(\".t\").oninput=e=>{s.t=e.target.textContent;save()};d.querySelector(\"button\").onclick=()=>{S.secs=S.secs.filter(x=>x!==s);save();render()};\n  d.onpointerup=()=>{s.w=d.offsetWidth;s.h=d.offsetHeight;save()};drag(d,d.querySelector(\".h\"),s);board.append(d)});\n S.cards.forEach(c=>{const d=document.createElement(\"div\");d.className=\"card\";d.style.cssText=`left:${c.x}px;top:${c.y}px;background:${c.c};transform:rotate(${(c.id%5-2)*.8}deg)`;\n  d.innerHTML=`<div class=\"h\"><button aria-label=\"Change color\">color<\/button><button aria-label=\"Delete card\">x<\/button><\/div>`+(c.pal?`<div class=\"sw\">${c.pal.map(p=>`<i style=\"background:${p}\" title=\"${p}\"><\/i>`).join(\"\")}<\/div>`:\"\")+`<div class=\"t\" contenteditable=\"true\" aria-label=\"Idea text\"><\/div>`;\n  const t=d.querySelector(\".t\");t.textContent=c.t;t.oninput=()=>{c.t=t.textContent;save()};\n  const [b1,b2]=d.querySelectorAll(\"button\");\n  b1.onclick=()=>{c.c=COLORS[(COLORS.indexOf(c.c)+1)%COLORS.length];save();render()};\n  b2.onclick=()=>{S.cards=S.cards.filter(x=>x!==c);save();render();toast(\"Card deleted\")};\n  drag(d,d.querySelector(\".h\"),c);board.append(d)});\n $(\"empty\").hidden=S.cards.length+S.secs.length>0}\nfunction pin(t,pal){S.cards.push({id:uid(),x:80+Math.random()*300,y:120+Math.random()*250,t,c:COLORS[S.cards.length%6],pal});save();render();toast(\"Pinned to board\")}\n$(\"addCard\").onclick=()=>pin(\"New idea - type here\");\n$(\"addSec\").onclick=()=>{S.secs.push({id:uid(),x:40+S.secs.length*30,y:100+S.secs.length*30,w:360,h:260,t:\"New section\",c:COLORS[S.secs.length%6]});save();render();toast(\"Section added\")};\n$(\"clear\").onclick=()=>{if(confirm(\"Clear the whole board?\")){S.cards=[];S.secs=[];save();render()}};\nconst pick=a=>a[Math.floor(Math.random()*a.length)];\nfunction reply(q){q=q.toLowerCase();const last=S.cards[S.cards.length-1];\n if(/campaign/.test(q)){const l=[...ANGLES].sort(()=>Math.random()-.5).slice(0,5);return{t:\"5 campaign ideas:\\n\"+l.map((x,i)=>(i+1)+\". \"+x).join(\"\\n\"),pin:l.join(\"\\n\")}}\n if(/palette|color/.test(q)){const k=Object.keys(MOODS).find(m=>q.includes(m))||\"futuristic\",p=MOODS[k];return{t:`A ${k} palette: ${p.join(\", \")}`,pin:k+\" palette\",pal:p}}\n if(/festival/.test(q)){const f=pick(FEST);return{t:\"Festival concept: \"+f,pin:f}}\n if(/brief/.test(q)){const s=last?last.t:\"your idea\";const b=`Creative brief\\nIdea: ${s}\\nGoal: spark curiosity and sign-ups\\nAudience: students, 18-24\\nTone: playful, confident\\nDeliverables: poster, reel, landing page`;return{t:b,pin:b}}\n if(/typo|font/.test(q)){const f=pick(FONTS);return{t:`Pair ${f[0]} (headlines) with ${f[1]} (body): ${f[2]}.`,pin:`Type: ${f[0]} + ${f[1]}`}}\n return{t:\"Try: campaign ideas, a futuristic palette, a college festival concept, a brief from your latest idea, or typography.\"}}\nfunction say(t,c,r){const d=document.createElement(\"div\");d.className=\"m \"+c;d.textContent=t;\n if(r&&r.pin){const b=document.createElement(\"button\");b.className=\"pin\";b.textContent=\"Pin to board\";b.onclick=()=>pin(r.pin,r.pal);d.append(document.createElement(\"br\"),b)}\n $(\"chat\").append(d);$(\"chat\").scrollTop=1e9}\nfunction ask(q){if(!q.trim())return;say(q,\"u\");setTimeout(()=>{const r=reply(q);say(r.t,\"a\",r)},300);$(\"ai\").value=\"\"}\n$(\"send\").onclick=()=>ask($(\"ai\").value);$(\"ai\").onkeydown=e=>{if(e.key===\"Enter\")ask($(\"ai\").value)};\n$(\"chips\").innerHTML=[\"Give me 5 campaign ideas\",\"Create a futuristic color palette\",\"Generate a college festival concept\",\"Turn this idea into a creative brief\",\"Suggest typography combinations\"].map(x=>`<button>${x}<\/button>`).join(\"\");\n$(\"chips\").onclick=e=>{if(e.target.tagName===\"BUTTON\")ask(e.target.textContent)};\nrender();say(\"Hi, I'm Muse. Drag cards, edit text, or ask me for ideas.\",\"a\");\nsetTimeout(()=>{$(\"load\").style.opacity=0;setTimeout(()=>$(\"load\").remove(),500)},600);\n<\/script><\/body><\/html>\n"}, {"n": 18, "name": "NewsGuard AI", "html": "<!DOCTYPE html>\n<html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\n<title>NewsGuard AI - Story Intelligence<\/title><style>:root{--ink:#1c2733;--bg:#eef1f5;--card:#fff;--blue:#2f5bea;--amber:#c47a00;--green:#1f7a4d;--red:#b3402f;--mut:#667385;--line:#d5dbe3}\n*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 \"Segoe UI\",system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}\nh1,h2,h3{font-family:Georgia,serif;margin:0}:focus-visible{outline:3px solid var(--blue);outline-offset:2px}\n.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:14px 24px;background:var(--ink);color:#fff}.top input{margin-left:auto;min-width:200px}\n.demo{background:#f6c453;color:#2a1c00;padding:3px 10px;border-radius:4px;font-size:.78rem;font-weight:600}\ninput,select,button{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:6px}button{cursor:pointer;background:#fff}\n.stats{display:flex;flex-wrap:wrap;gap:24px;padding:14px 24px;border-bottom:1px solid var(--line);background:#fff}.stats div b{font:700 1.5rem Georgia,serif;display:block}.stats span{font-size:.8rem;color:var(--mut)}\n.topics{display:flex;flex-wrap:wrap;gap:6px;padding:12px 24px}.topics button{border-radius:20px;padding:3px 12px}.topics button[aria-pressed=true]{background:var(--blue);color:#fff;border-color:var(--blue)}\n.layout{display:grid;grid-template-columns:340px 1fr;gap:16px;padding:0 24px 24px}\n.list label{font-size:.85rem;color:var(--mut)}.s{display:block;width:100%;text-align:left;margin-top:8px;padding:12px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line)}\n.s[aria-cur \n@media(prefers-reduced-motion:reduce){*{animation:none!important}}\n<\/style><\/head>\n<body>\n<header class=\"top\"><h1>NewsGuard AI<\/h1><span class=\"demo\">DEMO - fictional stories and sources<\/span>\n<input id=\"q\" type=\"search\" placeholder=\"Search stories or topics\" aria-label=\"Search stories\"><\/header>\n<section class=\"stats\" id=\"stats\" aria-label=\"Overview\"><\/section>\n<div class=\"topics\" id=\"topics\" role=\"group\" aria-label=\"Filter by topic\"><\/div>\n<div class=\"layout\">\n<nav class=\"list\" aria-label=\"Story clusters\"><label>Sort <select id=\"sort\"><option value=\"cov\">Most sources<\/option><option value=\"brk\">Breaking first<\/option><\/select><\/label><div id=\"stories\"><\/div><p id=\"empty\" class=\"empty\" hidden>No stories match. Clear the search or choose \"All topics\".<\/p><\/nav>\n<article class=\"detail\" id=\"detail\" aria-live=\"polite\"><p class=\"empty\" id=\"load\">Loading story clusters...<\/p><\/article><\/div>\n<div id=\"toast\" class=\"toast\" role=\"alert\" hidden><\/div>\n<script>// DEMO / FICTIONAL stories and sources. Not real news.\nconst STORIES=[\n{id:1,title:\"Riverbend Bridge Closed After Inspection Finding\",topic:\"Infrastructure\",breaking:true,status:\"Corroborated\",\n summary:\"Officials closed the fictional Riverbend Bridge after an inspection reported cracking in a support beam. Reopening timelines differ between outlets.\",\n sources:[[\"Harbor Daily\",\"Reports closure as precaution\",.1,\"Detailed\"],[\"Meridian Wire\",\"Stresses commuter disruption\",-.4,\"Moderate\"],[\"The Lantern\",\"Questions past maintenance\",-.6,\"Detailed\"],[\"Civic Ledger\",\"Quotes city engineer\",.2,\"Detailed\"]],\n timeline:[[\"06:10\",\"Inspection team flags cracking\"],[\"08:00\",\"City announces closure\"],[\"11:30\",\"Detour plan published\"],[\"15:00\",\"Engineer says repairs may take weeks\"]],related:[2,5]},\n{id:2,title:\"City Council Debates Transit Fare Change\",topic:\"Transit\",breaking:false atch\",JSON.stringify(watch))}catch(e){}toast(watch.includes(s.id)?\"Watching story\":\"Stopped watching\");list();detail()};\n $(\"detail\").querySelectorAll(\"[data-a]\").forEach(b=>b.onclick=()=>$(\"out\").textContent=ai(s,b.dataset.a))}\nfunction ai(s,k){const t=avg(s),tone=t>.2?\"mostly positive\":t<-.2?\"mostly negative\":\"mixed or neutral\";\n if(k===\"sum\")return`${s.summary}\\nCoverage: ${s.sources.length} sources, overall tone ${tone}. Status \"${s.status}\" means ${key(s)===\"Corroborated\"?\"several sources agree on core facts\":key(s)===\"Partially\"?\"sources agree on some facts but differ on others\":\"few or no independent sources confirm the claim yet\"}. Uncertainty remains.`;\n if(k===\"dev\")return`Over ${s.timeline.length} updates: `+s.timeline.map(t=>t[1]).join(\" > \")+\".\";\n if(k===\"cmp\"){const hi=[...s.sources].sort((a,b)=>b[2]-a[2]);return`Most positive framing: ${hi[0][0]} (${hi[0][1].toLowerCase()}). Most negative: ${hi[hi.length-1][0]} (${hi[hi.length-1][1].toLowerCase()}). Differences in framing are not proof that either is inaccurate.`}\n return s.timeline.map(t=>\"- \"+t[0]+\": \"+t[1]).join(\"\\n\")}\nfunction init(){setTimeout(()=>{if(location.search.includes(\"error\")){$(\"detail\").innerHTML='<p class=\"empty\">Could not load stories. <button onclick=\"location.href=location.pathname\">Retry<\/button><\/p>';return}stats();list();detail()},600)}\ninit();\n<\/script><\/body><\/html>\n"}, {"n": 19, "name": "DisasterWatch", "html": "<!DOCTYPE html>\n<html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\n<title>DisasterWatch - Emergency Command<\/title><style>:root{--bg:#0a1017;--p:#121c27;--line:#25364a;--tx:#e6edf5;--mut:#8fa3b8;--red:#ff4d4d;--amb:#ffb020;--cy:#35c2ff;--grn:#3ddc84}\n*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 \"Segoe UI\",system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 ident map\"><\/svg><\/section>\n<section class=\"panel\"><h2>Priority queue<\/h2><div class=\"tools\"><select id=\"filter\" aria-label=\"Filter type\"><option value=\"\">All types<\/option><\/select><\/div><div id=\"queue\"><\/div><p id=\"empty\" class=\"state\" hidden>No incidents of this type. Choose \"All types\".<\/p><\/section>\n<section class=\"panel\" id=\"detail\" aria-live=\"polite\"><\/section>\n<section class=\"panel\"><h2>Resources &amp; shelters<\/h2><div id=\"res\"><\/div><\/section>\n<section class=\"panel\"><h2>Alert center<\/h2><ul id=\"alerts\" class=\"feed\"><\/ul><\/section>\n<section class=\"panel ai\"><h2>Command assistant<\/h2><div id=\"chips\" class=\"chips\"><\/div><div id=\"out\" class=\"out\">Ask a question about the simulated situation.<\/div><div class=\"ask\"><input id=\"ai\" placeholder=\"Ask about priorities or resources\" aria-label=\"Ask\"><button id=\"send\">Ask<\/button><\/div><\/section>\n<\/main>\n<div id=\"toast\" class=\"toast\" role=\"alert\" hidden><\/div>\n<script>// SIMULATED / DEMO emergency data. Not real events.\nconst INCIDENTS=[\n{id:\"I1\",name:\"River flood, East Basin\",type:\"Flood\",x:70,y:30,sev:4,aff:5200,needs:[\"Rescue\",\"Medical\"],note:\"Water level rising 0.3 m/h\"},\n{id:\"I2\",name:\"Cyclone landfall, Coast Road\",type:\"Cyclone\",x:20,y:68,sev:5,aff:9100,needs:[\"Rescue\",\"Medical\",\"Engineering\"],note:\"Winds above 110 km/h\"},\n{id:\"I3\",name:\"Hillside wildfire, North Ridge\",type:\"Wildfire\",x:42,y:14,sev:3,aff:1800,needs:[\"Fire\"],note:\"Spread toward ridge villages\"},\n{id:\"I4\",name:\"Aftershock damage, Old Quarter\",type:\"Earthquake\",x:58,y:62,sev:3,aff:2400,needs:[\"Engineering\",\"Medical\"],note:\"Collapsed structures reported\"},\n{id:\"I5\",name:\"Chemical leak, Dock Zone\",type:\"Industrial\",x:84,y:76,sev:2,aff:600,needs:[\"Fire\",\"Medical\"],note:\"Perimeter set, wind steady\"}];\nconst TEAMS=[\n{id:\"T1\",name:\"Medic Unit A\",kind:\"Medical\",at:null,x:50,y:50},{id:\"T2\",name:\"Medic Unit B\",kind:\"Medical\",at:null,x:30,y:60},\n{id:\"T3\",name:\"Boat Crew 1\",kind:\"Rescue\",at:null,x:75,y:40},{id:\"T4\",name:\"Boat Crew 2\",kind:\"Rescue\",at:null,x:15,y:55},\n{id:\"T5\",name:\"Fire Brigade N\",kind:\"Fire\",at:null,x:45,y:25},{id:\"T6\",name:\"Engineering Corps\",kind:\"Engineering\",at:null,x:60,y:55}];\nconst SHELTERS=[[\"Central School\",600,540],[\"Stadium Hall\",1200,610],[\"Community Centre\",300,295],[\"Hill Church\",250,90]];\nconst RESOURCES=[[\"Ambulances\",12,4],[\"Rescue boats\",8,3],[\"Food kits (x100)\",40,12],[\"Generators\",15,5]];\n<\/script><script>const $=id=>document.getElementById(id);\nlet I=JSON.parse(JSON.stringify(INCIDENTS)),T=JSON.parse(JSON.stringify(TEAMS)),sel=\"I2\";\ntry{const s=JSON.parse(localStorage.getItem(\"dw_teams\")||\"null\");if(s)T=s}catch(e){}\nconst COL={Flood:\"#35c2ff\",Cyclone:\"#b388ff\",Wildfire:\"#ff8a3d\",Earthquake:\"#ffd24d\",Industrial:\"#3ddc84\"};\nconst now=()=>new Date().toLocaleTimeString([], {hour:\"2-digit\",minute:\"2-digit\",second:\"2-digit\"});\nfunction toast(t){const e=$(\"toast\");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2200)}\nconst cover=i=>T.filter(t=>t.at===i.id).map(t=>t.kind);\nconst gaps=i=>i.needs.filter(n=>!cover(i).includes(n));\nconst score=i=>Math.round(i.sev*20+i.aff/200+gaps(i).length*6);\nconst ranked=()=>[...I].sort((a,b)=>score(b)-score(a));\nfunction alertAdd(t,red){const li=document.createElement(\"li\");if(red)li.className=\"r\";li.innerHTML=`<time>${now()}<\/time>${t}`;$(\"alerts\").prepend(li);while($(\"alerts\").children.length>12)$(\"alerts\").lastChild.remove()}\nfunction kpis(){const aff=I.reduce((a,i)=>a+i.aff,0);\n $(\"kpis\").innerHTML=[[\"Active incidents\",I.length],[\"Critical (sev 4+)\",I.filter(i=>i.sev>=4).length,1],[\"Teams available\",T.filter(t=>!t.at).length+\"/\"+T.length],[\"Shelters open\",SHELTERS.length],[\"People affected\",aff.toLocaleString()],[\"Unmet needs\",I.reduce((a,i)=>a+gaps(i).length,0),1]].map(k=>`<div class=\"k ${k[2]?\"crit\":\"\"}\"><b>${k[1]}<\/b><span>${k[0]}<\/span><\/div>`).join(\"\")}\nfunction map(){let s='<defs><pattern id=\"g\" width=\"10\" height=\"10\" patternUnits=\"userSpaceOnUse\"><path d=\"M10 0H0V10\" fill=\"none\" stroke=\"#1a2a3b\" stroke-width=\".3\"/><\/pattern><\/defs><rect width=\"100\" height=\"90\" fill=\"url(#g)\"/><path d=\"M0 70 Q20 60 30 80 T60 90 L0 90Z\" fill=\"#10283c\"/>';\n T.forEach(t=>s+=`<rect x=\"${t.x-1}\" y=\"${t.y-1}\" width=\"2\" height=\"2\" fill=\"${t.at?\"#8fa3b8\":\"#3ddc84\"}\"><title>${t.name}<\/title><\/rect>`);\n I.forEach(i=>{const c=COL[i.type];s+=`<g class=\"mk\" tabindex=\"0\" role=\"button\" aria-label=\"${i.name}, severity ${i.sev}\" data-id=\"${i.id}\"><circle class=\"p\" cx=\"${i.x}\" cy=\"${i.y}\" r=\"${2+i.sev}\" fill=\"${c}\" opacity=\".35\"/><circle cx=\"${i.x}\" cy=\"${i.y}\" r=\"2\" fill=\"${c}\" stroke=\"${i.id===sel?\"#fff\":\"none\"}\" stroke-width=\".6\"/><text x=\"${i.x+3}\" y=\"${i.y-3}\" font-size=\"3\" fill=\"#e6edf5\">${i.type}<\/text><\/g>`});\n $(\"map\").innerHTML=s;$(\"map\").querySelectorAll(\".mk\").forEach(g=>{g.onclick=()=>pick(g.dataset.id);g.onkeydown=e=>{if(e.key===\"Enter\")pick(g.dataset.id)}})}\nfunction queue(){const f=$(\"filter\").value,l=ranked().filter(i=>!f||i.type===f);$(\"empty\").hidden=l.length>0;\n $(\"queue\").innerHTML=l.map((i,n)=>`<button class=\"inc s${i.sev}\" data-id=\"${i.id}\" aria-current=\"${i.id===sel}\"><b>#${n+1} ${i.name}<\/b><small>${i.type} - ${i.aff.toLocaleString()} affected - <span class=\"badge sv${i.sev}\">Severity ${i.sev}<\/span> priority ${score(i)}<\/small><\/button>`).join(\"\")}\n$(\"queue\").onclick=e=>{const b=e.target.closest(\"[data-id]\");if(b)pick(b.dataset.id)};$(\"filter\").onchange=queue;\nfunction pick(id){sel=id;queue();map();detail()}\nfunction detail(){const i=I.find(x=>x.id===sel),g=gaps(i),av=T.filter(t=>!t.at&&g.includes(t.kind));\n $(\"detail\").innerHTML=`<h2>${i.name}<\/h2><p>${i.type}, severity ${i.sev}/5. ${i.note}. ${i.aff.toLocaleString()} people affected.<\/p><p>Needs: ${i.needs.map(n=>`${n} ${cover(i).includes(n)?\"(covered)\":\"(unmet)\"}`).join(\", \")}<\/p>\n <p>Assigned: ${T.filter(t=>t.at===i.id).map(t=>t.name).join(\", \")||\"none\"}<\/p><div>${av.map(t=>`<button class=\"act\" data-t=\"${t.id}\">Assign ${t.name}<\/button>`).join(\"\")||'<span class=\"state\">No matching teams available.<\/span>'}<\/div>`;\n $(\"detail\").querySelectorAll(\"[data-t]\").forEach(b=>b.onclick=()=>{const t=T.find(x=>x.id===b.dataset.t);t.at=i.id;try{localStorage.setItem(\"dw_teams\",JSON.stringify(T))}catch(e){}toast(t.name+\" assigned\");alertAdd(t.name+\" dispatched to \"+i.name);refresh()})}\nfunction res(){$(\"res\").innerHTML=RESOURCES.map(r=>`<div class=\"rl\"><span>${r[0]}<\/span><span>${r[2]}/${r[1]} left<\/span><\/div><div class=\"bar ${r[2]/r[1]<.3?\"lo\":\"\"}\"><i style=\"width:${r[2]/r[1]*100}%\"><\/i><\/div>`).join(\"\")+SHELTERS.map(s=>`<div class=\"rl\"><span>${s[0]}<\/span><span>${s[2]}/${s[1]}<\/span><\/div><div class=\"bar ${s[2]/s[1]>.9?\"lo\":\"\"}\"><i style=\"width:${s[2]/s[1]*100}%\"><\/i><\/div>`).join(\"\")}\nfunction refresh(){kpis();queue();map();detail()}\nfunction ai(q){q=q.toLowerCase();const r=ranked();\n if(/priority|first/.test(q))return`Top priority: ${r[0].name} (score ${score(r[0])}, severity ${r[0].sev}, ${r[0].aff.toLocaleString()} affected, unmet: ${gaps(r[0]).join(\", \")||\"none\"}).`;\n if(/insufficient|resource|short/.test(q)){const l=I.filter(i=>gaps(i).length);return l.length?l.map(i=>`${i.name}: missing ${gaps(i).join(\", \")}`).join(\"\\n\")+\"\\nLow stock: \"+RESOURCES.filter(x=>x[2]/x[1]<.3).map(x=>x[0]).join(\", \"):\"All incidents have matching teams assigned.\"}\n if(/team|assign/.test(q)){const i=r.find(x=>gaps(x).length)||r[0];const c=T.filter(t=>!t.at&&gaps(i).includes(t.kind)).sort((a,b)=>Math.hypot(a.x-i.x,a.y-i.y)-Math.hypot(b.x-i.x,b.y-i.y))[0];return c?`Assign ${c.name} to ${i.name}: matches an unmet need (${c.kind}) and is the closest available on the map.`:`No available team matches ${i.name}'s unmet needs.`}\n if(/summar|situation/.test(q))return`${I.length} incidents, ${I.filter(i=>i.sev>=4).length} critical. ${T.filter(t=>!t.at).length} of ${T.length} teams free. Highest priority: ${r[0].name}. Unmet needs: ${I.reduce((a,i)=>a+gaps(i).length,0)}. (Simulated data.)`;\n return\"I can cover priority, resource gaps, team assignment, or a situation summary.\"}\nfunction ask(q){if(q.trim()){$(\"out\").textContent=ai(q);$(\"ai\").value=\"\"}}\n$(\"send\").onclick=()=>ask($(\"ai\").value);$(\"ai\").onkeydown=e=>{if(e.key===\"Enter\")ask($(\"ai\").value)};\n$(\"chips\").innerHTML=[\"Which incident should receive priority?\",\"Where are resources insufficient?\",\"Summarize the emergency situation.\",\"Which response team should be assigned?\"].map(x=>`<button>${x}<\/button>`).join(\"\");\n$(\"chips\").onclick=e=>{if(e.target.tagName===\"BUTTON\")ask(e.target.textContent)};\nsetInterval(()=>$(\"clock\").textContent=\"Sim time \"+now(),1000);\nfunction sim(){const i=I[Math.floor(Math.random()*I.length)],up=Math.random()<.5;i.aff+=up?Math.round(Math.random()*400):0;\n if(up&&i.sev<5&&Math.random()<.25){i.sev++;alertAdd(`Severity raised to ${i.sev}: ${i.name}`,true)}else alertAdd(`Update: ${i.name} - ${i.note}`);refresh();res()}\nfunction init(){setTimeout(()=>{if(location.search.includes(\"error\")){$(\"state\").innerHTML='Feed unavailable. <button onclick=\"location.href=location.pathname\">Retry<\/button>';return}\n $(\"state\").hidden=true;$(\"main\").hidden=false;I.forEach(i=>{const o=$(\"filter\");});[...new Set(I.map(i=>i.type))].forEach(t=>$(\"filter\").add(new Option(t,t)));\n alertAdd(\"Simulated feed connected\",false);alertAdd(\"Cyclone advisory active for Coast Road\",true);refresh();res();setInterval(sim,5000)},700)}\ninit();\n<\/script><\/body><\/html>\n"}, {"n": 20, "name": "SpaceOps", "html": "<!DOCTYPE html>\n<html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\n<title>SpaceOps - Mission Control<\/title><style>:root{--bg:#050a14;--p:#0b1626;--line:#1b3350;--cy:#35e0ff;--gr:#3ddc84;--am:#ffb020;--rd:#ff4d6d;--tx:#d9e8f7;--mut:#7f98b3}\n*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#0e2038,var(--bg) 60%);color:var(--tx);font:15px/1.45 \"Segoe UI\",system-ui,sans-serif;min-height:100vh;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}\nh1,h2{margin:0;font-family:\"Bahnschrift\",\"Arial Narrow\",sans-serif;letter-spacing:.05em}h1{font-size:1.5rem;text-shadow:0 0 12px var(--cy)}h1 small{color:var(--cy);font-size:.8rem}h2{font-size:.95rem;color:var(--cy);margin-bottom:8px}\n:focus-visible{outline:3px solid var(--am);outline-offset:2px}\n.boot{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:9;color:var(--cy);font-size:1.2rem;transition:opacity .6s}.boot.err{color:var(--rd)}\n.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line)}.sim{background:var(--am);color:#241800;font-weight:700;font-size:.78rem;padding:3px 10px;border-radius:3px}.met{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--cy)}\n.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;padding:12px 20px}.k{background:var(--p);border:1px solid var(--line);padding:8px 12px;border-radius:6px}.k b{display:block;font-size:1.5rem;font-variant-numeric:tabular-nums;text-shadow:0 0 10px currentColor}.k span{font-size:.75rem;color:var(--mut)}\n.ok{color:var(--gr)}.wa{color:var(--am)}.al{color:var(--rd)}\nmain{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:0 20px 20px}.p{background:var(--p);border:1px solid var(--line);border-radius:8px;padding:12px;min-width:0}.wide{grid-column:1/-1}\nsvg{width:100%;height:auto;background:#060d1a;border-radius:6px}.note{font-size:.8rem;color:var(--mut);margin:6px 0 0}\n.ch span{font-size:.78rem;color:var(--mut)}canvas{width:100%;height:auto;display:block;margin-bottom:6px}\n.subs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.s{border:1px solid var(--line);border-radius:6px;padding:8px}.s b{display:block}.s i{display:block;height:5px;border-radius:3px;margin-top:4px;background:currentColor;transition:width .6s}\n.log{list-style:none;margin:0;padding:0;max-height:210px;overflow:auto;font-size:.85rem}.log li{padding:4px 8px;border-left:3px solid var(--am);margin-bottom:4px;background:#07101d;animation:in .3s}.log li.r{border-color:var(--rd)}.log li.g{border-color:var(--gr)}.log time{color:var(--mut);margin-right:6px}\n.term li{border-color:var(--cy);font-family:Consolas,monospace}.empty{color:var(--mut);border-color:var(--line)!important}\n@keyframes in{from{opacity:0;transform:translateX(-6px)}}\n.tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line)}.tl li{padding:4px 0 4px 10px;color:var(--mut)}.tl li.on{color:var(--cy);text-shadow:0 0 8px var(--cy);font-weight:700}.tl li.done{color:var(--gr)}\n.ask{display:flex;gap:8px;margin-top:8px}input,button{font:inherit;padding:7px 10px;border-radius:5px;border:1px solid var(--line);background:#07101d;color:var(--tx)}input{flex:1;min-width:0}button{cursor:pointer}button:hover{border-color:var(--cy)}\n.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.out{border-left:4px solid var(--cy);background:#07101d;padding:10px 12px;white-space:pre-line}\n.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--cy);color:#031018;padding:8px 18px;border-radius:4px;font-weight:600;z-index:10}\n@media(max-width:1000px){main{grid-template-columns:1fr 1fr}}\n@media(max-width:620px){main{grid-template-columns:1fr;padding:0 12px 16px}.kpis,.top{padding-left:12px;padding-right:12px}}\n@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}\n<\/style><\/head>\n<body>\n<div id=\"boot\" class=\"boot\" role=\"status\">Establishing link to Aster-7...<\/div>\n<header class=\"top\"><h1>SpaceOps <small>Aster-7<\/small><\/h1><span class=\"sim\">SIMULATED MISSION DATA<\/span><span class=\"met\" id=\"met\">MET 00:00:00<\/span><\/header>\n<section class=\"kpis\" id=\"kpis\" aria-label=\"Mission summary\"><\/section>\n<main>\n<section class=\"p orbit\"><h2>Orbit &amp; ground link<\/h2>\n<svg viewBox=\"0 0 200 120\" role=\"img\" aria-label=\"Spacecraft orbit around a planet\"><defs><radialGradient id=\"pl\"><stop offset=\"0\" stop-color=\"#2b6cb0\"/><stop offset=\"1\" stop-color=\"#0a1a33\"/><\/radialGradient><\/defs>\n<ellipse cx=\"100\" cy=\"60\" rx=\"82\" ry=\"46\" fill=\"none\" stroke=\"#2a4a6a\" stroke-dasharray=\"3 3\"/><circle cx=\"100\" cy=\"60\" r=\"28\" fill=\"url(#pl)\"/><circle cx=\"100\" cy=\"32\" r=\"2.5\" fill=\"#3ddc84\"/><text x=\"106\" y=\"30\" font-size=\"6\" fill=\"#3ddc84\">Ground<\/text>\n<line id=\"lnk\" stroke=\"#35e0ff\" stroke-width=\".6\" stroke-dasharray=\"2 2\"/><g id=\"craft\"><circle r=\"3.5\" fill=\"#fff\"/><circle r=\"7\" fill=\"#35e0ff\" opacity=\".25\"/><\/g><\/svg>\n<p id=\"orb\" class=\"note\"><\/p><\/section>\n<section class=\"p\"><h2>Telemetry<\/h2><div class=\"ch\"><span>Battery %<\/span><canvas id=\"c1\" width=\"360\" height=\"70\"><\/canvas><span>Temperature C<\/span><canvas id=\"c2\" width=\"360\" height=\"70\"><\/canvas><span>Signal %<\/span><canvas id=\"c3\" width=\"360\" height=\"70\"><\/canvas><\/div><\/section>\n<section class=\"p\"><h2>Subsystems<\/h2><div id=\"subs\" class=\"subs\"><\/div><\/section>\n<section class=\"p\"><h2>Alert console<\/h2><ul id=\"alerts\" class=\"log\"><\/ul><\/section>\n<section class=\"p\"><h2>Mission timeline<\/h2><ol id=\"tl\" class=\"tl\"><\/ol><\/section>\n<section class=\"p\"><h2>Command interface<\/h2><ul id=\"term\" class=\"log term\"><\/ul><div class=\"ask\"><input id=\"cmd\" placeholder=\"type help\" aria-label=\"Command input\" autocomplete=\"off\"><button id=\"run\">Send<\/button><\/div><\/section>\n<section class=\"p wide\"><h2>Mission AI<\/h2><div id=\"chips\" class=\"chips\"><\/div><div id=\"out\" class=\"out\">Select a question about the simulated telemetry.<\/div><\/section>\n<\/main>\n<div id=\"toast\" class=\"toast\" role=\"alert\" hidden><\/div>\n<script>// SIMULATED MISSION DATA - fictional spacecraft \"Aster-7\". Not real telemetry.\nconst MISSION={name:\"Aster-7\",phases:[\"Launch\",\"Orbit insertion\",\"Cruise\",\"Science operations\",\"Eclipse pass\"]};\nconst SUBS=[\"Power\",\"Thermal\",\"Comms\",\"Propulsion\",\"Payload\",\"Attitude\"];\nconst HELP=[\"help - list commands\",\"status - mission summary\",\"ping - test link to ground\",\"heater on|off - control heater\",\"reorient - realign antenna\",\"safemode - toggle low-power mode\",\"phase next - advance mission phase\"];\n<\/script><script>const $=id=>document.getElementById(id);\nlet s={bat:84,temp:23,sig:80,pow:330,fuel:96,met:0,ang:-1.2,heater:false,safe:false,phase:2,spike:0,alerted:{}},H={bat:[],temp:[],sig:[]},prev=null,hist=[],hi=0;\nconst now=()=>new Date().toLocaleTimeString([], {hour12:false});\nfunction toast(t){const e=$(\"toast\");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2000)}\nfunction log(id,t,c){const ul=$(id),e=ul.querySelector(\".empty\");if(e)e.remove();const li=document.createElement(\"li\");if(c)li.className=c;li.innerHTML=`<time>${now()}<\/time>${t}`;ul.prepend(li);while(ul.children.length>14)ul.lastChild.remove()}\nconst ecl=()=>Math.sin(s.ang)>0&&Math.abs(Math.cos(s.ang)*82)<28;\nfunction subs(){const h={Power:Math.min(100,s.bat+10),Thermal:Math.max(0,100-Math.abs(s.temp-22)*4),Comms:s.sig,Propulsion:s.fuel,Payload:s.safe?60:91,Attitude:88};return h}\nconst st=v=>v>=65?\"ok\":v>=40?\"wa\":\"al\",lab={ok:\"Nominal\",wa:\"Watch\",al:\"Alert\"};\nfunction tick(){prev={...s};s.met++;s.ang+=0.05;\n const e=ecl();s.bat=Math.max(0,Math.min(100,s.bat+(e?-0.25:0.12)*(s.safe?.5:1)-(s.heater?.05:0)));\n let tgt=22+(e?-6:4)+(s.heater?8:0)+s.spike;if(s.spike>0)s.spike-=0.8;if(s.spike<0)s.spike=0;s.temp+=(tgt-s.temp)*.12+(Math.random()-.5)*.4;\n if(Math.random()<.025&&s.spike===0){s.spike=14;log(\"alerts\",\"Anomaly: thermal spike detected on Payload bus\",\"r\")}\n const x=100+82*Math.cos(s.ang),y=60+46*Math.sin(s.ang),d=Math.hypot(x-100,y-32);s.sig+=((s.align?95:Math.max(15,90-d*.5))-s.sig)*.2+(Math.random()-.5)*2;\n s.pow=(s.safe?210:330)+(e?-60:20)+Math.random()*8;s.fuel-=.002;\n H.bat.push(s.bat);H.temp.push(s.temp);H.sig.push(s.sig);Object.values(H).forEach(a=>a.length>60&&a.shift());\n [[\"bat\",s.bat<30,\"Battery below 30%\"],[\"temp\",s.temp>36,\"Temperature above 36 C\"],[\"sig\",s.sig<35,\"Signal below 35%\"]].forEach(a=>{if(a[1]&&!s.alerted[a[0]]){log(\"alerts\",a[2],\"r\");s.alerted[a[0]]=1}if(!a[1])s.alerted[a[0]]=0});\n hist.push({t:s.met,bat:s.bat,temp:s.temp,sig:s.sig});if(hist.length>12)hist.shift();render()}\nfunction chart(id,a,col,lo,hi){const c=$(id),x=c.getContext(\"2d\");x.clearRect(0,0,c.width,c.height);x.strokeStyle=\"#16304a\";x.lineWidth=1;for(let i=1;i<4;i++){x.beginPath();x.moveTo(0,i*17.5);x.lineTo(c.width,i*17.5);x.stroke()}\n x.strokeStyle=col;x.lineWidth=2;x.shadowColor=col;x.shadowBlur=8;x.beginPath();a.forEach((v,i)=>{const px=i/59*c.width,py=c.height-(v-lo)/(hi-lo)*c.height;i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke();x.shadowBlur=0}\nfunction render(){const h=subs(),vals=Object.values(h),health=Math.round(vals.reduce((a,b)=>a+b,0)/vals.length),al=$(\"alerts\").querySelectorAll(\".r\").length;\n const k=[[\"Mission health\",health+\"%\",st(health)],[\"Comms signal\",Math.round(s.sig)+\"%\",st(s.sig)],[\"Battery\",s.bat.toFixed(1)+\"%\",st(s.bat)],[\"Temperature\",s.temp.toFixed(1)+\" C\",s.temp>36||s.temp<5?\"al\":\"ok\"],[\"Phase\",MISSION.phases[s.phase],\"ok\"],[\"Power draw\",Math.round(s.pow)+\" W\",\"ok\"]];\n $(\"kpis\").innerHTML=k.map(x=>`<div class=\"k\"><b class=\"${x[2]}\">${x[1]}<\/b><span>${x[0]}<\/span><\/div>`).join(\"\");\n $(\"subs\").innerHTML=SUBS.map(n=>{const v=Math.round(h[n]),c=st(v);return`<div class=\"s ${c}\"><b style=\"color:var(--tx)\">${n}<\/b>${lab[c]} ${v}%<i style=\"width:${v}%\"><\/i><\/div>`}).join(\"\");\n const hh=Math.floor(s.met/3600),mm=Math.floor(s.met%3600/60);$(\"met\").textContent=`MET ${String(hh).padStart(2,\"0\")}:${String(mm).padStart(2,\"0\")}:${String(s.met%60).padStart(2,\"0\")}`;\n const x=100+82*Math.cos(s.ang),y=60+46*Math.sin(s.ang);$(\"craft\").setAttribute(\"transform\",`translate(${x} ${y})`);$(\"lnk\").setAttribute(\"x1\",100);$(\"lnk\").setAttribute(\"y1\",32);$(\"lnk\").setAttribute(\"x2\",x);$(\"lnk\").setAttribute(\"y2\",y);$(\"lnk\").style.opacity=s.sig>35?1:.2;\n $(\"orb\").textContent=ecl()?\"In planetary shadow: battery draining.\":\"In sunlight: battery charging.\";\n chart(\"c1\",H.bat,\"#3ddc84\",0,100);chart(\"c2\",H.temp,\"#ffb020\",0,50);chart(\"c3\",H.sig,\"#35e0ff\",0,100);\n $(\"tl\").innerHTML=MISSION.phases.map((p,i)=>`<li class=\"${i<s.phase?\"done\":i===s.phase?\"on\":\"\"}\">${p}<\/li>`).join(\"\")}\nfunction cmd(t){t=t.trim().toLowerCase();if(!t)return;hist.cmds=(hist.cmds||[]);hist.cmds.push(t);hi=hist.cmds.length;log(\"term\",\"&gt; \"+t);let r;\n if(t===\"help\")r=HELP.join(\"<br>\");else if(t===\"status\")r=`Health nominal? Battery ${s.bat.toFixed(0)}%, temp ${s.temp.toFixed(1)} C, signal ${s.sig.toFixed(0)}%.`;\n else if(t===\"ping\")r=`Reply in ${Math.round(400-s.sig*2.5)} ms (simulated)`;else if(t===\"heater on\"){s.heater=true;r=\"Heater ON\"}else if(t===\"heater off\"){s.heater=false;r=\"Heater OFF\"}\n else if(t===\"reorient\"){s.align=true;setTimeout(()=>s.align=false,15000);r=\"Antenna realigned for 15 s\"}\n else if(t===\"safemode\"){s.safe=!s.safe;r=\"Safe mode \"+(s.safe?\"ON (low power)\":\"OFF\")}\n else if(t===\"phase next\"){s.phase=(s.phase+1)%MISSION.phases.length;r=\"Phase: \"+MISSION.phases[s.phase]}else r=\"Unknown command. Type help.\";\n log(\"term\",r,\"g\");toast(\"Command sent\");render()}\n$(\"run\").onclick=()=>{cmd($(\"cmd\").value);$(\"cmd\").value=\"\"};\n$(\"cmd\").onkeydown=e=>{if(e.key===\"Enter\"){cmd($(\"cmd\").value);$(\"cmd\").value=\"\"}else if(e.key===\"ArrowUp\"&&hist.cmds){hi=Math.max(0,hi-1);$(\"cmd\").value=hist.cmds[hi]||\"\"}};\nfunction ai(k){const h=subs(),w=Object.entries(h).sort((a,b)=>a[1]-b[1])[0],a=[...$(\"alerts\").querySelectorAll(\".r\")][0];\n if(k==0)return a?`Latest anomaly: ${a.textContent}. Temperature now ${s.temp.toFixed(1)} C. Thermal spikes in this simulation usually decay within about 20 s.`:\"No anomalies logged yet.\";\n if(k==1)return`${w[0]} needs most attention at ${Math.round(w[1])}% (${lab[st(w[1])]}).`;\n if(k==2)return`Phase: ${MISSION.phases[s.phase]}. Battery ${s.bat.toFixed(0)}%, temp ${s.temp.toFixed(1)} C, signal ${s.sig.toFixed(0)}%, draw ${Math.round(s.pow)} W. ${ecl()?\"Spacecraft is in shadow.\":\"Spacecraft is in sunlight.\"} (Simulated data.)`;\n const o=hist[0]||{bat:s.bat,temp:s.temp,sig:s.sig},f=v=>(v>0?\"+\":\"\")+v.toFixed(1);return`Over the last ${hist.length} s: battery ${f(s.bat-o.bat)}%, temperature ${f(s.temp-o.temp)} C, signal ${f(s.sig-o.sig)}%.`}\n$(\"chips\").innerHTML=[\"Explain the latest telemetry anomaly\",\"Which subsystem needs attention?\",\"Summarize the mission status\",\"What changed in the last update?\"].map((x,i)=>`<button data-i=\"${i}\">${x}<\/button>`).join(\"\");\n$(\"chips\").onclick=e=>{if(e.target.dataset.i)$(\"out\").textContent=ai(+e.target.dataset.i)};\n$(\"alerts\").innerHTML='<li class=\"empty\">No active alerts. All subsystems nominal.<\/li>';\nsetTimeout(()=>{const b=$(\"boot\");if(location.search.includes(\"error\")){b.className=\"boot err\";b.innerHTML='Link lost. <button onclick=\"location.href=location.pathname\">Retry<\/button>';return}\n b.style.opacity=0;setTimeout(()=>b.remove(),600);for(let i=0;i<30;i++)tick();log(\"term\",\"Link established. Type help.\",\"g\");setInterval(tick,1000)},900);\n<\/script><\/body><\/html>\n"}];
const tabs=document.getElementById("tabs"),main=document.getElementById("main"),msg=document.getElementById("msg");
const frames={};
function show(i){
  APPS.forEach((a,j)=>{const b=tabs.children[j];b.setAttribute("aria-selected",j===i);b.tabIndex=j===i?0:-1;if(frames[j])frames[j].classList.toggle("on",j===i)});
  if(!frames[i]){
    try{const f=document.createElement("iframe");f.title=APPS[i].name;f.srcdoc=APPS[i].html;f.className="on";
      f.onload=()=>msg.hidden=true;main.append(f);frames[i]=f;msg.hidden=false;
      setTimeout(()=>{msg.hidden=true},1500)}
    catch(e){msg.hidden=false;msg.textContent="Could not load "+APPS[i].name+"."}
  }else msg.hidden=true;
  try{localStorage.setItem("hub_tab",i)}catch(e){}
}
APPS.forEach((a,i)=>{const b=document.createElement("button");b.role="tab";b.innerHTML="<small>"+a.n+"</small>"+a.name;b.onclick=()=>show(i);
  b.onkeydown=e=>{let k=e.key==="ArrowRight"?1:e.key==="ArrowLeft"?-1:0;if(k){const n=(i+k+APPS.length)%APPS.length;show(n);tabs.children[n].focus()}};tabs.append(b)});
let start=0;try{start=Math.min(APPS.length-1,+localStorage.getItem("hub_tab")||0)}catch(e){}
show(start);
</script></body></html>
