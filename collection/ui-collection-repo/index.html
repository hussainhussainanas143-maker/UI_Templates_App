const SRC={"campusiq": "<!DOCTYPE html>\n<html lang=\"en\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>CampusIQ<\/title>\n<style>\n:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6fb;--card:#fff;--ink:#14213d;--mut:#5b6784;--line:#e2e7f2;--acc:#4f46e5;--ok:#0f9d6b;--warn:#d97706;--bad:#dc2626}\n:root:not([data-theme=\"light\"]){}\n@media(prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#0e1424;--card:#172038;--ink:#e8ecf8;--mut:#9aa6c4;--line:#27324f;--acc:#8b86ff}}\n:root[data-theme=\"dark\"]{--bg:#0e1424;--card:#172038;--ink:#e8ecf8;--mut:#9aa6c4;--line:#27324f;--acc:#8b86ff}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\n*,*:before,*:after{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,\"Segoe UI\",sans-serif;overflow-x:hidden}\n:focus-visible{outline:3px solid var(--acc);outline-offset:2px}\nheader{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--line)}\nh1{font-size:20px;margin:0}h1 span{color:var(--acc)}h2{font-size:16px;margin:0 0 10px}\n.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}\nselect,input,button{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px}\nbutton{cursor:pointer;transition:.15s}button:hover{border-color:var(--acc)}\nbutton.p{background:var(--acc);color:#fff;border-color:var(--acc)}\nmain{max-width:1200px;margin:0 auto;padding:18px;display:grid;gap:16px}\n.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}\n.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}\n.kpi b{display:block;font-size:26px}.kpi small{color:var(--mut)}\n.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}\n@media(max-width:860px){.grid{grid-template-columns:1fr}}\n.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:520px}\nth,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:600;font-size:13px}\ntd input{width:64px}\n.badge{padding:2px 8px;border-radius:99px;font-size:12px;color:#fff}\n.low{background:var(--ok)}.mid{background:var(--warn)}.high{background:var(--bad)}\nul{list-style:none;margin:0;padding:0}li.as{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}\nli.done span{text-decoration:line-through;color:var(--mut)}\nform.add{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}form.add input[type=text]{grid-column:1/3}\n.plan{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}\n.plan div{background:var(--bg);border-radius:10px;padding:8px;font-size:13px}\n.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chips button{font-size:13px;border-radius:99px}\n#log{max-height:340px;overflow:auto;display:grid;gap:10px}\n.q{justify-self:end;background:var(--acc);color:#fff;padding:6px 12px;border-radius:12px}\n.a{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:14px}\n.a dt{font-weight:700;color:var(--acc);font-size:12px;text-transform:uppercase;margin-top:6px}.a dd{margin:0}\n.dots span{display:inline-block;width:7px;height:7px;margin:2px;border-radius:50%;background:var(--acc);animation:b 1s infinite}\n.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}\n@keyframes b{50%{transform:translateY(-5px);opacity:.4}}\n.row{display:flex;gap:8px}.row input{flex:1;min-width:0}\n#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;max-width:90vw}\n#toast.on{opacity:1}\n.empty,.err{color:var(--mut);padding:10px;text-align:center}.err{color:var(--bad)}\n.note{font-size:12px;color:var(--mut)}\n<\/style><\/head><body>\n<header>\n<h1>Campus<span>IQ<\/span> <span class=\"note\">\u00b7 demo data, simulated<\/span><\/h1>\n<div class=\"tools\">\n<label>Semester <select id=\"sem\"><\/select><\/label>\n<label>Target CGPA <input id=\"target\" type=\"number\" min=\"5\" max=\"10\" step=\"0.1\" style=\"width:72px\"><\/label>\n<button id=\"theme\" aria-label=\"Toggle dark mode\">Theme<\/button>\n<button id=\"reset\" aria-label=\"Reset demo data\">Reset<\/button>\n<\/div><\/header>\n<main>\n<section class=\"kpis\" id=\"kpis\" aria-label=\"Key metrics\"><\/section>\n<div class=\"grid\">\n<div class=\"card\"><h2>Subjects (edit marks and attendance)<\/h2><div class=\"scroll\"><table><thead><tr><th>Subject<\/th><th>Cr<\/th><th>Marks<\/th><th>Attend %<\/th><th>Hrs/wk<\/th><th>Risk<\/th><\/tr><\/thead><tbody id=\"rows\"><\/tbody><\/table><\/div>\n<p id=\"subErr\" class=\"err\" role=\"alert\" hidden><\/p>\n<h2 style=\"margin-top:16px\">Marks vs predicted final<\/h2>\n<div id=\"chart\" role=\"img\" aria-label=\"Bar chart comparing current and predicted marks per subject\"><\/div><\/div>\n<div class=\"card\"><h2>Ask CampusIQ AI<\/h2>\n<div class=\"chips\" id=\"chips\"><\/div>\n<div id=\"log\" aria-live=\"polite\"><p class=\"empty\">Ask a question. Answers are computed from your data below.<\/p><\/div>\n<form class=\"row\" id=\"askForm\" style=\"margin-top:10px\"><input id=\"askIn\" aria-label=\"Ask CampusIQ\" placeholder=\"e.g. Can I reach 9 CGPA?\"><button class=\"p\">Ask<\/button><\/form><\/div>\n<\/div>\n<div class=\"grid\">\n<div class=\"card\"><h2>Weekly study planner<\/h2><label>Hours this week <input id=\"hours\" type=\"number\" min=\"5\" max=\"70\" style=\"width:72px\"><\/label> <button class=\"p\" id=\"gen\">Generate plan<\/button><div id=\"plan\" class=\"plan\" style=\"margin-top:10px\"><\/div><\/div>\n<div class=\"card\"><h2>Assignments &amp; exams<\/h2><ul id=\"asg\"><\/ul>\n<form class=\"add\" id=\"asgForm\"><input type=\"text\" id=\"asgT\" aria-label=\"Assignment title\" placeholder=\"Assignment title\" required><select id=\"asgS\" aria-label=\"Subject\"><\/select><input type=\"date\" id=\"asgD\" aria-label=\"Due date\" required><button class=\"p\" style=\"grid-column:1/3\">Add assignment<\/button><\/form><\/div>\n<\/div>\n<\/main>\n<div id=\"toast\" role=\"status\"><\/div>\n<script>\nconst SEED={sem:5,target:9,hours:28,prev:{3:{c:20,g:8.2},4:{c:22,g:8.0}},\nsubjects:{5:[{n:\"Machine Learning\",c:4,m:72,a:82,h:6},{n:\"Operating Systems\",c:4,m:58,a:68,h:4},{n:\"Database Systems\",c:3,m:84,a:91,h:4},{n:\"Computer Networks\",c:3,m:66,a:74,h:3},{n:\"Software Engineering\",c:3,m:88,a:93,h:3}],\n4:[{n:\"Algorithms\",c:4,m:80,a:88,h:5},{n:\"Discrete Maths\",c:4,m:70,a:80,h:4},{n:\"Computer Architecture\",c:3,m:76,a:85,h:3}],\n3:[{n:\"Data Structures\",c:4,m:86,a:90,h:5},{n:\"Probability\",c:3,m:74,a:81,h:3}]},\nasg:[{t:\"ML mini-project report\",s:\"Machine Learning\",d:\"2026-10-12\",x:false},{t:\"OS scheduling lab\",s:\"Operating Systems\",d:\"2026-10-09\",x:false},{t:\"ER diagram design\",s:\"Database Systems\",d:\"2026-10-20\",x:true},{t:\"Subnetting worksheet\",s:\"Computer Networks\",d:\"2026-10-15\",x:false}],\nexams:[{s:\"Operating Systems\",d:\"Oct 28\"},{s:\"Machine Learning\",d:\"Nov 2\"},{s:\"Computer Networks\",d:\"Nov 6\"}]};\nlet S;const $=id=>document.getElementById(id);\nconst load=()=>{try{const r=localStorage.getItem(\"campusiq\");S=r?JSON.parse(r):structuredClone(SEED)}catch(e){S=structuredClone(SEED)}};\nconst save=()=>{try{localStorage.setItem(\"campusiq\",JSON.stringify(S))}catch(e){}};\nconst toast=m=>{const t=$(\"toast\");t.textContent=m;t.classList.add(\"on\");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove(\"on\"),2200)};\nconst gp=m=>m>=90?10:m>=80?9:m>=70?8:m>=60?7:m>=50?6:4;\nconst subs=()=>S.subjects[S.sem]||[];\nconst pending=s=>S.asg.filter(a=>!a.x&&a.s===s).length;\nconst pred=s=>Math.max(0,Math.min(100,Math.round(s.m*.6+(s.m+(s.h-5)*1.5-(s.a<75?5:0))*.4)));\nconst risk=s=>Math.min(100,Math.round((100-s.m)*.6+Math.max(0,75-s.a)*1.6+pending(s.n)*6));\nconst lvl=r=>r>=40?[\"high\",\"High\"]:r>=22?[\"mid\",\"Medium\"]:[\"low\",\"Low\"];\nfunction sgpa(list,f){let c=0,w=0;list.forEach(s=>{c+=s.c;w+=s.c*gp(f(s))});return c?w/c:0}\nfunction cgpa(f){let c=0,w=0;Object.entries(S.prev).forEach(([k,v])=>{if(+k<S.sem){c+=v.c;w+=v.c*v.g}});subs().forEach(s=>{c+=s.c;w+=s.c*gp(f(s))});return c?w/c:0}\nfunction stats(){const l=subs();const att=l.length?l.reduce((a,s)=>a+s.a,0)/l.length:0;const rs=l.length?l.reduce((a,s)=>a+risk(s)*s.c,0)/l.reduce((a,s)=>a+s.c,0):0;\nreturn{cg:cgpa(s=>s.m),pc:cgpa(pred),att,rs:Math.round(rs),pend:S.asg.filter(a=>!a.x).length,hrs:l.reduce((a,s)=>a+s.h,0)}}\nfunction renderKpis(){const k=stats(),[c,t]=lvl(k.rs);\nconst items=[[\"Current CGPA\",k.cg.toFixed(2),\"Target \"+S.target],[\"Predicted CGPA\",k.pc.toFixed(2),k.pc>=S.target?\"On track\":\"Gap \"+(S.target-k.pc).toFixed(2)],[\"Attendance\",k.att.toFixed(0)+\"%\",k.att<75?\"Below 75% rule\":\"Safe\"],[\"Academic risk\",k.rs+\"/100\",`<span class=\"badge ${c}\">${t}<\/span>`],[\"Assignments pending\",k.pend,\"across subjects\"],[\"Study hours\",k.hrs+\"h\",\"per week\"]];\n$(\"kpis\").innerHTML=items.map(i=>`<div class=\"card kpi\"><small>${i[0]}<\/small><b>${i[1]}<\/b><small>${i[2]}<\/small><\/div>`).join(\"\")}\nfunction renderRows(){const l=subs();$(\"rows\").innerHTML=l.length?l.map((s,i)=>{const [c,t]=lvl(risk(s));return`<tr><td>${s.n}<\/td><td>${s.c}<\/td><td><input type=\"number\" min=\"0\" max=\"100\" value=\"${s.m}\" data-i=\"${i}\" data-f=\"m\" aria-label=\"Marks ${s.n}\"><\/td><td><input type=\"number\" min=\"0\" max=\"100\" value=\"${s.a}\" data-i=\"${i}\" data-f=\"a\" aria-label=\"Attendance ${s.n}\"><\/td><td><input type=\"number\" min=\"0\" max=\"40\" value=\"${s.h}\" data-i=\"${i}\" data-f=\"h\" aria-label=\"Weekly hours ${s.n}\"><\/td><td><span class=\"badge ${c}\">${t}<\/span><\/td><\/tr>`}).join(\"\"):`<tr><td colspan=\"6\" class=\"empty\">No subjects for this semester.<\/td><\/tr>`}\nfunction renderChart(){const l=subs();if(!l.length){$(\"chart\").innerHTML='<p class=\"empty\">No data to chart.<\/p>';return}\nconst W=560,H=200,bw=W/l.length;let g=\"\";l.forEach((s,i)=>{const x=i*bw+bw*.12,w=bw*.34,h1=s.m*1.5,h2=pred(s)*1.5;\ng+=`<rect x=\"${x}\" y=\"${170-h1}\" width=\"${w}\" height=\"${h1}\" rx=\"3\" fill=\"var(--acc)\"/><rect x=\"${x+w+3}\" y=\"${170-h2}\" width=\"${w}\" height=\"${h2}\" rx=\"3\" fill=\"var(--ok)\"/><text x=\"${x}\" y=\"190\" font-size=\"10\" fill=\"var(--mut)\">${s.n.split(\" \")[0]}<\/text><text x=\"${x}\" y=\"${164-h1}\" font-size=\"10\" fill=\"var(--ink)\">${s.m}<\/text><text x=\"${x+w+3}\" y=\"${164-h2}\" font-size=\"10\" fill=\"var(--ink)\">${pred(s)}<\/text>`});\n$(\"chart\").innerHTML=`<svg viewBox=\"0 0 ${W} ${H}\" width=\"100%\"><title>Marks vs predicted<\/title>${g}<\/svg><p class=\"note\"><span style=\"color:var(--acc)\">\u25a0<\/span> Current <span style=\"color:var(--ok)\">\u25a0<\/span> Predicted<\/p>`}\nfunction renderAsg(){const l=S.asg;$(\"asg\").innerHTML=(l.length?l.map((a,i)=>`<li class=\"as ${a.x?\"done\":\"\"}\"><input type=\"checkbox\" ${a.x?\"checked\":\"\"} data-i=\"${i}\" aria-label=\"Complete ${a.t}\"><span style=\"flex:1\">${a.t}<br><small class=\"note\">${a.s} \u00b7 due ${a.d}<\/small><\/span><button data-del=\"${i}\" aria-label=\"Delete ${a.t}\">\u2715<\/button><\/li>`).join(\"\"):'<li class=\"empty\">No assignments. Add one below.<\/li>')+S.exams.map(e=>`<li class=\"as\"><span>\ud83d\udcdd Exam: ${e.s} <small class=\"note\">${e.d}<\/small><\/span><\/li>`).join(\"\");\n$(\"asgS\").innerHTML=subs().map(s=>`<option>${s.n}<\/option>`).join(\"\")}\nfunction plan(){const l=subs(),H=+$(\"hours\").value;if(!l.length)return $(\"plan\").innerHTML='<p class=\"empty\">No subjects.<\/p>';\nif(!(H>=5&&H<=70))return toast(\"Enter 5\u201370 study hours\");S.hours=H;save();\nconst w=l.map(s=>risk(s)+10),T=w.reduce((a,b)=>a+b,0),days=[\"Mon\",\"Tue\",\"Wed\",\"Thu\",\"Fri\",\"Sat\"];\nconst alloc=l.map((s,i)=>({n:s.n,h:Math.round(H*w[i]/T*2)/2})).sort((a,b)=>b.h-a.h);\n$(\"plan\").innerHTML=days.map((d,i)=>{const a=alloc[i%alloc.length],b=alloc[(i+2)%alloc.length];return`<div><b>${d}<\/b><br>${a.n}: ${(a.h/3).toFixed(1)}h<br>${b.n}: ${(b.h/4).toFixed(1)}h<\/div>`}).join(\"\");toast(\"Study plan generated\")}\nfunction answer(q){q=q.toLowerCase();const l=subs(),k=stats();if(!l.length)return null;\nconst worst=[...l].sort((a,b)=>risk(b)-risk(a)),w=worst[0],low=l.filter(s=>s.a<75);let r,e,rec,cf;\nif(/focus|weak|subject/.test(q)){r=`${w.n} carries the highest risk score (${risk(w)}).`;e=`Marks ${w.m}, attendance ${w.a}%, ${pending(w.n)} pending assignment(s), ${w.h}h/week.`;rec=`Move 2\u20133 extra hours/week to ${w.n} and clear its assignments first.`;cf=86}\nelse if(/cgpa|reach|target|\\b9\\b/.test(q)){const gap=S.target-k.pc;r=gap<=0?`Predicted CGPA ${k.pc.toFixed(2)} already meets ${S.target}.`:`Predicted CGPA ${k.pc.toFixed(2)} is ${gap.toFixed(2)} below target ${S.target}.`;e=`Current ${k.cg.toFixed(2)}; weakest: ${worst.slice(0,2).map(s=>s.n+\" (\"+s.m+\")\").join(\", \")}.`;rec=gap<=0?\"Maintain current hours.\":`Lift ${w.n} above 70 and keep every subject above 75% attendance; a gap this size is ${gap>0.5?\"hard\":\"achievable\"} in one semester.`;cf=gap>0.5?64:78}\nelse if(/hour|week|study/.test(q)){const need=Math.round(k.hrs*(1+k.rs/150));r=`Your current load is ${k.hrs}h; risk ${k.rs}/100 suggests more.`;e=`Risk by subject: ${worst.map(s=>s.n.split(\" \")[0]+\" \"+risk(s)).join(\", \")}.`;rec=`Aim for about ${need}h this week, weighted toward ${w.n}.`;cf=72}\nelse if(/risk/.test(q)){const hi=worst.filter(s=>risk(s)>=22);r=hi.length?`${hi.length} subject(s) raise your risk to ${k.rs}/100.`:`Risk is low (${k.rs}/100).`;e=hi.map(s=>`${s.n}: ${risk(s)}`).join(\"; \")||\"All subjects below threshold.\";rec=hi.length?`Start with ${hi[0].n}; fix attendance where under 75%.`:\"Keep current routine.\";cf=84}\nelse if(/attend|class/.test(q)){r=low.length?`${low.length} subject(s) are under 75% attendance.`:\"All subjects meet 75%.\";e=low.map(s=>`${s.n} ${s.a}%`).join(\", \")||`Average ${k.att.toFixed(0)}%.`;rec=low.length?low.map(s=>{const n=Math.ceil((37.5-s.a/2)/.25);return `${s.n}: attend next ${n} classes in a row (assuming 50 held)`}).join(\"; \"):\"No action needed.\";cf=70}\nelse return{r:\"I can answer on focus, CGPA target, study hours, risk and attendance.\",e:\"Try one of the suggested prompts.\",rec:\"Rephrase with one of those topics.\",cf:30};\nreturn{r,e,rec,cf}}\nfunction ask(q){if(!q.trim())return toast(\"Type a question first\");const log=$(\"log\");if(log.querySelector(\".empty\"))log.innerHTML=\"\";\nlog.insertAdjacentHTML(\"beforeend\",`<div class=\"q\"><\/div>`);log.lastChild.textContent=q;\nlog.insertAdjacentHTML(\"beforeend\",`<div class=\"a dots\" id=\"ld\"><span><\/span><span><\/span><span><\/span><\/div>`);log.scrollTop=1e9;\nsetTimeout(()=>{const a=answer(q);$(\"ld\").remove();log.insertAdjacentHTML(\"beforeend\",a?`<dl class=\"a\"><dt>Reason<\/dt><dd>${a.r}<\/dd><dt>Evidence<\/dt><dd>${a.e}<\/dd><dt>Recommendation<\/dt><dd>${a.rec}<\/dd><dt>Confidence<\/dt><dd>${a.cf}%<\/dd><\/dl>`:`<div class=\"a err\">No subject data for this semester.<\/div>`);log.scrollTop=1e9},600)}\nfunction renderAll(){renderKpis();renderRows();renderChart();renderAsg()}\nfunction init(){load();$(\"sem\").innerHTML=Object.keys(S.subjects).sort().map(s=>`<option value=\"${s}\">Semester ${s}<\/option>`).join(\"\");$(\"sem\").value=S.sem;$(\"target\").value=S.target;$(\"hours\").value=S.hours;\n$(\"chips\").innerHTML=[\"Which subject should I focus on?\",\"Can I reach 9 CGPA?\",\"How many hours should I study this week?\",\"Which subjects are putting my semester at risk?\",\"Check my attendance\"].map(c=>`<button type=\"butt reduce((a,g)=>a+g.s/g.t,0)/S.goals.length*100):0;\nconst k=[[\"Monthly income\",inr(S.income)],[\"Monthly spending\",inr(sp)],[\"Savings rate\",rate+\"%\"],[\"Remaining budget\",inr(rem)],[\"Emergency fund\",(S.saved/(sp||1)).toFixed(1)+\" months\"],[\"Goal progress\",g+\"%\"]];\n$(\"kpis\").innerHTML=k.map(a=>`<div class=\"card kpi\"><small>${a[0]}<\/small><b${a[0]===\"Remaining budget\"&&rem<0?' class=\"neg\"':\"\"}>${a[1]}<\/b><\/div>`).join(\"\")}\nfunction donut(){const d=byCat().filter(x=>x.v>0),T=d.reduce((a,x)=>a+x.v,0);if(!T)return $(\"donut\").innerHTML='<p class=\"empty\">No expenses yet.<\/p>';\nconst cols=[\"#15803d\",\"#b45309\",\"#0e7490\",\"#7c3aed\",\"#be123c\",\"#4d7c0f\",\"#475569\"];let a0=-Math.PI/2,p=\"\";const R=70,r=44;\nd.forEach((x,i)=>{const a1=a0+x.v/T*Math.PI*2-.001,L=a1-a0>Math.PI?1:0,P=(q,rr)=>[100+rr*Math.cos(q),100+rr*Math.sin(q)];const[A,B,C,D]=[P(a0,R),P(a1,R),P(a1,r),P(a0,r)];\np+=`<path d=\"M${A}A${R} ${R} 0 ${L} 1 ${B}L${C}A${r} ${r} 0 ${L} 0 ${D}Z\" fill=\"${cols[CATS.indexOf(x.c)]}\"><title>${x.c}: ${inr(x.v)}<\/title><\/path>`;a0=a1});\n$(\"donut\").innerHTML=`<div class=\"row\" style=\"align-items:center;flex-wrap:wrap\"><svg viewBox=\"0 0 200 200\" width=\"170\"><title>Spending breakdown<\/title>${p}<text x=\"100\" y=\"105\" text-anchor=\"middle\" font-size=\"14\" fill=\"var(--ink)\">${inr(T)}<\/text><\/svg><ul style=\"list-style:none;padding:0;margin:0;font:13px system-ui\">${d.map(x=>`<li><span style=\"color:${cols[CATS.indexOf(x.c)]}\">\u25cf<\/span> ${x.c} ${Math.round(x.v/T*100)}%<\/li>`).join(\"\")}<\/ul><\/div>`}\nfunction flow(){const h=[...S.hist,[\"Oct\",S.income,spent()+subTotal()]],mx=Math.max(...h.map(x=>x[1]));\n$(\"flow\").innerHTML=`<svg viewBox=\"0 0 360 170\" width=\"100%\"><title>Cash flow<\/title>`+h.map((x,i)=>{const X=12+i*58;return`<rect x=\"${X}\" y=\"${140-x[1]/mx*110}\" width=\"20\" height=\"${x[1]/mx*110}\" fill=\"var(--line)\" rx=\"3\"/><rect x=\"${X+22}\" y=\"${140-x[2]/mx*110}\" width=\"20\" he \"><div class=\"row\" style=\"justify-content:space-between\"><b>${g.n}<\/b><span>${inr(g.s)} / ${inr(g.t)}<\/span><\/div><div class=\"bar\"><i style=\"width:${Math.min(100,g.s/g.t*100)}%\"><\/i><\/div><div class=\"row\" style=\"margin-top:4px\"><button class=\"b\" data-add=\"${i}\">+ \u20b95,000<\/button><button class=\"b\" data-gdel=\"${i}\" aria-label=\"Delete ${g.n}\">Delete<\/button><\/div><\/div>`).join(\"\"):'<p class=\"empty\">No goals yet. Create one below.<\/p>'}\nfunction answer(q){q=q.toLowerCase();const cs=byCat(),over=cs.filter(x=>x.v>x.b).sort((a,b)=>(b.v-b.b)-(a.v-a.b)),save=Math.max(1,S.income-spent()-subTotal());\nif(/overspend|over|spend/.test(q))return over.length?{r:`You exceeded budget in ${over.length} categor${over.length>1?\"ies\":\"y\"}; ${over[0].c} is worst by ${inr(over[0].v-over[0].b)}.`,e:over.map(x=>`${x.c}: ${inr(x.v)} vs ${inr(x.b)}`).join(\"; \"),rec:`Cap ${over[0].c} at its limit for the rest of the month; review the top 3 transactions there.`,c:90}:{r:\"No category is over budget.\",e:`Spending ${inr(spent())} within limits.`,rec:\"Consider moving surplus into a goal.\",c:85};\nif(/laptop|goal|how long/.test(q)){const g=S.goals.find(g=>q.includes(g.n.toLowerCase()))||S.goals[0];if(!g)return{r:\"You have no goals yet.\",e:\"Goal list is empty.\",rec:\"Create a goal on the Budget & Goals tab.\",c:50};const m=Math.ceil((g.t-g.s)/save);return{r:`${g.n} needs ${inr(g.t-g.s)} more; about ${m} month(s) at your current surplus.`,e:`Surplus \u2248 ${inr(save)}/month after spending and subscriptions.`,rec:`Auto-transfer ${inr(Math.round(save*.5))} monthly to cut time to ~${Math.ceil((g.t-g.s)/(save*.5+1))} months only if surplus allows.`,c:75}}\nif(/budget|create/.test(q)){const n=S.income*.5,w=S.income*.3,s=S.income*.2;return{r:\"A 50/30/20 split suits your income.\",e:`Needs ${inr(n)}, wants ${inr(w)}, savings ${inr(s)} versus your actual spend ${inr(spent()+subTotal())}.`,rec:\"Needs (rent, food, transport, health) up to \"+inr(n)+\"; keep shopping and entertainment under \"+inr(w)+\".\",c:72}}\nif(/subscri/.test(q)){const l=S.subs.filter(s=>s.u<4);return l.length?{r:`${l.length} subscription(s) are barely used.`,e:l.map(s=>`${s.n}: ${s.u} uses/mo, ${inr(s.a)}`).join(\"; \"),rec:`Cancelling saves ${inr(l.reduce((a,s)=>a+s.a,0))}/month.`,c:88}:{r:\"All subscriptions look well used.\",e:\"Each has 4+ uses/month.\",rec:\"No action.\",c:80}}\nreturn{r:\"I can help with overspending, goals, budgets and subscriptions.\",e:\"Try a suggested prompt.\",rec:\"Rephrase around one of those.\",c:30}}\nfunction ask(q){if(!q.trim())return toast(\"Type a question\");const l=$(\"log\");if(l.querySelector(\".empty\"))l.innerHTML=\"\";l.insertAdjacentHTML(\"beforeend\",'<div class=\"q\"><\/div>');l.lastChild.textContent=q;l.insertAdjacentHTML(\"beforeend\",'<div class=\"a dots\" id=\"ld\"><span><\/span><span><\/span><span><\/span><\/div>');l.scrollTop=1e9;\nsetTimeout(()=>{const a=answer(q);$(\"ld\").remove();l.insertAdjacentHTML(\"beforeend\",`<dl class=\"a\"><dt>Reason<\/dt><dd>${a.r}<\/dd><dt>Evidence<\/dt><dd>${a.e}<\/dd><dt>Recommendation<\/dt><dd>${a.rec}<\/dd><dt>Confidence<\/dt><dd>${a.c}%<\/dd><\/dl>`);l.scrollTop=1e9},600)}\nfunction all(){kpis();donut();flow();subs();tx();plan()}\nfunction show(t){tab=t;[\"overview\",\"tx\",\"plan\"].forEach(x=>$(\"p-\"+x).hidden=x!==t);$(\"nav\").innerHTML=[[\"overview\",\"Overview\"],[\"tx\",\"Transactions\"],[\"plan\",\"Budget & Goals\"]].map(x=>`<button data-t=\"${x[0]}\" ${x[0]===t?'aria-current=\"true\"':\"\"}>${x[1]}<\/button>`).join(\"\")}\n$(\"nav\").onclick=e=>{const b=e.target.closest(\"button\");if(b)show(b.dataset.t)};\n$(\"txf\").onsubmit=e=>{e.preventDefault();const a=+$(\"txa\").value,n=$(\"txd\").value.trim(),er=$(\"txe\");if(!n||!(a>0)){er.hidden=false;er.textContent=\"Enter a description and an amount above 0.\";return}er.hidden=true;S.tx.push({id:Date.now(),d:\"2026-10-05\",n,c:$(\"txc\").value,a});$(\"txd\").value=$(\"txa\").value=\"\";save();all();to
