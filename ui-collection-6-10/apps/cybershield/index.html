<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CyberShield</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0b0d12;--card:#141821;--ink:#e7eaf1;--mut:#8a93a6;--line:#232a38;--acc:#f43f5e;--crit:#f43f5e;--high:#fb923c;--med:#facc15;--low:#38bdf8;--ok:#34d399}
:root[data-theme="light"]{--bg:#eef0f4;--card:#fff;--ink:#12161f;--mut:#5b6578;--line:#dce0e8;--acc:#dc2626;--crit:#dc2626;--high:#ea580c;--med:#a16207;--low:#0369a1;--ok:#059669}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 ui-monospace,Consolas,"SF Mono",monospace;overflow-x:hidden}
button,input,select{font:inherit;color:var(--ink)}:focus-visible{outline:3px solid var(--med);outline-offset:2px}
.b,input,select{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 10px}.b{cursor:pointer;transition:.15s}.b:hover{border-color:var(--acc)}.b.p{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700}
header{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:19px;letter-spacing:2px}h1 i{color:var(--acc);font-style:normal}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.live{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--mut)}.led{width:9px;height:9px;border-radius:50%;background:var(--ok);animation:p 1.4s infinite}.paused .led{background:var(--med);animation:none}@keyframes p{50%{opacity:.3}}
main{max-width:1300px;margin:auto;padding:14px 18px;display:grid;gap:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;min-width:0}
.kpi small{color:var(--mut);text-transform:uppercase;font-size:11px}.kpi b{display:block;font-size:26px}
h2{margin:0 0 8px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:1px}
.g{display:grid;grid-template-columns:1.3fr 1fr;gap:12px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:520px}th,td{padding:6px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mut);font-size:11px;text-transform:uppercase}
tr.al{cursor:pointer}tr.al:hover td,tr.al:focus td{background:var(--bg)}tr.res td{opacity:.45}
.sev{padding:1px 8px;border-radius:99px;font-size:11px;font-weight:700;color:#0b0d12}.Critical{background:var(--crit)}.High{background:var(--high)}.Medium{background:var(--med)}.Low{background:var(--low)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.chips button{border-radius:99px;font-size:12px}
#log{max-height:280px;overflow:auto;display:grid;gap:8px}
.q{justify-self:end;background:var(--acc);color:#fff;padding:6px 12px;border-radius:10px}
.a{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;margin:0}.a dt{font-weight:700;color:var(--acc);font-size:11px;text-transform:uppercase;margin-top:6px}.a dd{margin:0}
.dots span{display:inline-block;width:7px;height:7px;margin:2px;border-radius:50%;background:var(--acc);animation:b 1s infinite}.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{50%{transform:translateY(-5px);opacity:.4}}
.row{display:flex;gap:8px}.row input{flex:1;min-width:0}
.dev{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.empty{color:var(--mut);text-align:center;padding:12px}.note{font-size:11px;color:var(--mut)}
.rec{padding:8px;border-left:3px solid var(--acc);background:var(--bg);margin-bottom:6px;border-radius:4px}
dialog{margin:0 0 0 auto;height:100%;max-height:100%;width:min(440px,100%);border:0;border-left:1px solid var(--line);background:var(--card);color:var(--ink);padding:18px}dialog::backdrop{background:rgba(0,0,0,.55)}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;opacity:0;pointer-events:none;transition:.25s}#toast.on{opacity:1}
@media(max-width:860px){.g,.g2{grid-template-columns:1fr}}
</style></head><body>
<header><h1>CYBER<i>SHIELD</i> <span class="note">· defensive monitoring · simulated safe demo events</span></h1>
<div class="bar"><span class="live" id="live"><span class="led"></span><span id="clk"></span></span><button class="b" id="pause">Pause</button><button class="b" id="theme" aria-label="Toggle theme">Theme</button></div></header>
<main>
<div class="kpis" id="kpis" aria-label="Security metrics"></div>
<div class="g">
<div class="card"><h2>Threat timeline · last 24 h</h2><div id="tl" role="img" aria-label="Alerts per hour by severity"></div></div>
<div class="card"><h2>Recommendations</h2><div id="recs"></div></div></div>
<div class="card"><div class="bar" style="margin-bottom:8px"><input id="q" type="search" aria-label="Search alerts" placeholder="Search alerts, hosts, users" style="flex:1;min-width:180px"><select id="fs" aria-label="Severity"><option>All</option><option>Critical</option><option>High</option><option>Medium</option><option>Low</option></select><select id="ft" aria-label="Status"><option>All</option><option value="open">Open</option><option value="investigating">Investigating</option><option value="resolved">Resolved</option></select></div>
<div class="scroll"><table><thead><tr><th>Time</th><th>Severity</th><th>Alert</th><th>Asset</th><th>Status</th></tr></thead><tbody id="tb"></tbody></table></div></div>
<div class="g2">
<div class="card"><h2>Devices &amp; system health</h2><div class="scroll"><table><thead><tr><th>Device</th><th>Status</th><th>Patch</th><th>Open alerts</th></tr></thead><tbody id="dv"></tbody></table></div></div>
<div class="card"><h2>Ask CyberShield AI</h2><div class="chips" id="chips"></div><div id="log" aria-live="polite"><p class="empty">Ask to explain an alert, prioritise or summarise.</p></div>
<form class="row" id="f" style="margin-top:8px"><input id="qi" aria-label="Ask a question" placeholder="Which incident should be investigated first?"><button class="b p">Ask</button></form></div></div>
</main>
<dialog id="dr" aria-labelledby="dtt"><h3 id="dtt" style="margin-top:0"></h3><div id="dbody"></div><div class="bar" style="margin-top:12px"><button class="b" id="inv">Investigate</button><button class="b p" id="rsv">Resolve</button><button class="b" id="cl">Close</button></div></dialog>
<div id="toast" role="status"></div>
<script>
const $=id=>document.getElementById(id);
const TPL=[["Repeated failed logins","Medium","Authentication","A burst of failed sign-ins suggests password guessing or a misconfigured client.","Enforce lockout and MFA; review source IP reputation."],["Impossible-travel sign-in","High","Identity","Two successful logins from distant locations within minutes.","Force password reset, revoke sessions, confirm with the user."],["Malware signature (test file)","Critical","Endpoint","Endpoint agent matched a known malicious signature (demo EICAR-style test).","Isolate host, run full scan, review recent downloads."],["Unusual outbound traffic","High","Network","Data volume to an unfamiliar external address is far above this host's baseline.","Inspect flows, block destination if unrecognised, check for exfiltration."],["Privilege change","Medium","Identity","An account was added to an administrator group outside a change window.","Verify with the change owner; revert if unapproved."],["Phishing email reported","Low","Email","A user reported a suspicious message with a mismatched sender domain.","Quarantine the message and notify recipients."],["External port scan","Low","Network","Sequential connection attempts from an external address (203.0.113.x demo range).","Rate-limit the source and confirm firewall rules."],["Missing critical patch","Medium","Vulnerability","The host lacks a security update released over 14 days ago.","Schedule patching in the next maintenance window."]];
const DEV=[["web-srv-01","Server",3],["db-core-02","Server",5],["vpn-gw-01","Network",4],["hr-laptop-14","Endpoint",2],["fin-laptop-07","Endpoint",3],["dev-ws-22","Endpoint",2],["mail-relay-01","Server",4],["iot-camera-09","IoT",1]].map((d,i)=>({id:i,n:d[0],k:d[1],w:d[2],on:true,patch:Math.random()>.7?"Behind":"Current"}));
const USERS=["a.krishnan","m.iqbal","r.mehta","s.venkat","p.rao","admin-svc"];
const W={Critical:4,High:3,Medium:2,Low:1};let A=[],nid=1,paused=false,timer,tick=0,fl=0;
const rnd=n=>Math.floor(Math.random()*n);
function mkAlert(minsAgo,pick){const t=TPL[pick??rnd(TPL.length)],d=DEV[rnd(DEV.length)],n=t[0].startsWith("Repeated")?5+rnd(40):0;fl+=n;
return{id:nid++,ts:Date.now()-minsAgo*60000,t:t[0],sev:t[1],cat:t[2],why:t[3],fix:t[4],dev:d.id,user:USERS[rnd(USERS.length)],src:"203.0.113."+(2+rnd(200)),n,st:"open"}}
for(let i=0;i<22;i++)A.push(mkAlert(Math.round(i*58+rnd(40))));A.sort((a,b)=>b.ts-a.ts);
A[0].sev="Critical";A[0].t="Malware signature (test file)";A[0].why=TPL[2][3];A[0].fix=TPL[2][4];A[3].st="investigating";A[8].st="resolved";A[9].st="resolved";
const toast=m=>{const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.i);toast.i=setTimeout(()=>t.classList.remove("on"),2200)};
const ago=ts=>{const m=Math.round((Date.now()-ts)/60000);return m<1?"just now":m<60?m+" min ago":Math.round(m/60)+" h ago"};
const live=()=>A.filter(a=>a.st!=="resolved"),dn=a=>DEV[a.dev].n;
const prio=a=>W[a.sev]*20+DEV[a.dev].w*3+Math.min(15,a.n/3)+(a.st==="open"?5:0);
const score=()=>{const l=live();return Math.max(0,Math.round(100-l.filter(a=>a.sev==="Critical").length*9-l.filter(a=>a.sev==="High").length*4-l.filter(a=>a.sev==="Medium").length*1.5-DEV.filter(d=>!d.on).length*4-DEV.filter(d=>d.patch==="Behind").length*2))};
function render(){const l=live(),sc=score();$("clk").textContent=(paused?"PAUSED":"LIVE")+" · tick "+tick;$("live").className="live"+(paused?" paused":"");
$("kpis").innerHTML=[["Security score",sc+"/100",sc>=70?"var(--ok)":sc>=45?"var(--med)":"var(--crit)"],["Critical alerts",l.filter(a=>a.sev==="Critical").length,"var(--crit)"],["Active incidents",l.filter(a=>a.sev==="Critical"||a.sev==="High").length,""],["Failed logins (24h)",fl,""],["Devices monitored",DEV.filter(d=>d.on).length+"/"+DEV.length,""]].map(k=>`<div class="card kpi"><small>${k[0]}</small><b style="color:${k[2]||"inherit"}">${k[1]}</b></div>`).join("");
const hrs=[...Array(24)].map((_,i)=>({C:0,H:0,M:0,L:0,t:0})),M={Critical:"C",High:"H",Medium:"M",Low:"L"};A.forEach(a=>{const h=Math.floor((Date.now()-a.ts)/36e5);if(h<24){hrs[23-h][M[a.sev]]++;hrs[23-h].t++}});const mx=Math.max(...hrs.map(h=>h.t),1);
$("tl").innerHTML=`<svg viewBox="0 0 480 150" width="100%"><title>Alerts per hour</title>`+hrs.map((h,i)=>{let y=120,s="";[["L","var(--low)"],["M","var(--med)"],["H","var(--high)"],["C","var(--crit)"]].forEach(([k,c])=>{const ht=h[k]/mx*100;y-=ht;if(ht)s+=`<rect x="${i*20+3}" y="${y}" width="15" height="${ht}" fill="${c}"/>`});return s+`<title>${24-i}h ago: ${h.t} alerts</title>`+(i%4===0?`<text x="${i*20}" y="140" font-size="10" fill="var(--mut)">-${23-i}h</text>`:"")}).join("")+`</svg>`;
const q=$("q").value.trim().toLowerCase(),fs=$("fs").value,ft=$("ft").value,v=A.filter(a=>(!q||(a.t+dn(a)+a.user+a.src).toLowerCase().includes(q))&&(fs==="All"||a.sev===fs)&&(ft==="All"||a.st===ft));
$("tb").innerHTML=v.length?v.slice(0,25).map(a=>`<tr class="al ${a.st==="resolved"?"res":""}" tabindex="0" data-i="${a.id}"><td>${ago(a.ts)}</td><td><span class="sev ${a.sev}">${a.sev}</span></td><td>${a.t}</td><td>${dn(a)}</td><td>${a.st}</td></tr>`).join(""):'<tr><td colspan="5" class="empty">No alerts match these filters.</td></tr>';
$("dv").innerHTML=DEV.map(d=>{const n=l.filter(a=>a.dev===d.id).length;return`<tr><td>${d.n}<br><span class="note">${d.k}</span></td><td><button class="b" data-dev="${d.id}" aria-label="Toggle ${d.n}"><span class="dev" style="background:${d.on?"var(--ok)":"var(--crit)"}"></span>${d.on?"Online":"Offline"}</button></td><td style="color:${d.patch==="Behind"?"var(--med)":"inherit"}">${d.patch}</td><td>${n}</td></tr>`}).join("");
const top=[...l].sort((a,b)=>prio(b)-prio(a))[0],rc=[];if(top)rc.push(`Investigate "${top.t}" on ${dn(top)} first (${top.sev}).`);if(fl>80)rc.push("Enable account lockout and MFA: failed logins are elevated.");const bp=DEV.filter(d=>d.patch==="Behind");if(bp.length)rc.push(`Patch ${bp.map(d=>d.n).join(", ")}.`);const off=DEV.filter(d=>!d.on);if(off.length)rc.push(`Restore monitoring on ${off.map(d=>d.n).join(", ")}.`);
$("recs").innerHTML=rc.length?rc.map(r=>`<div class="rec">${r}</div>`).join(""):'<p class="empty">No outstanding recommendations.</p>'}
let cur=null;function drawer(id){const a=A.find(x=>x.id===id);if(!a)return;cur=a;$("dtt").innerHTML=`<span class="sev ${a.sev}">${a.sev}</span> ${a.t}`;$("dbody").innerHTML=`<p>${a.why}</p><p class="note">Asset: ${dn(a)} · User: ${a.user} · Source: ${a.src}${a.n?" · "+a.n+" failed attempts":""}<br>Detected ${ago(a.ts)} · Status: ${a.st} · Priority score ${Math.round(prio(a))}</p><div class="rec"><b>Recommended action</b><br>${a.fix}</div><p class="note">Simulated demo event. No real systems are involved.</p>`;$("dr").showModal()}
function answer(q){q=q.toLowerCase();const l=live(),o=[...l].sort((a,b)=>prio(b)-prio(a));
if(/explain|alert|what is/.test(q)){const a=cur||o[0];if(!a)return{r:"No active alerts to explain.",e:"All alerts resolved.",rec:"Keep monitoring.",c:60};return{r:`"${a.t}" on ${dn(a)}: ${a.why}`,e:`${a.sev} severity, category ${a.cat}, source ${a.src}, user ${a.user}.`,rec:a.fix,c:82}}
if(/first|investigate|priorit/.test(q)){if(!o.length)return{r:"Nothing to investigate.",e:"No open alerts.",rec:"Review recently resolved items.",c:60};const a=o[0];return{r:`Investigate "${a.t}" on ${dn(a)} first.`,e:`${a.sev}, asset criticality ${DEV[a.dev].w}/5, priority ${Math.round(prio(a))}. Next: ${o.slice(1,3).map(x=>x.t+" ("+Math.round(prio(x))+")").join("; ")}.`,rec:a.fix,c:85}}
if(/change|recent|new/.test(q)){const r=A.filter(a=>Date.now()-a.ts<36e5);return{r:`${r.length} alert(s) arrived in the last hour.`,e:r.slice(0,3).map(a=>a.sev+": "+a.t).join("; ")||"None.",rec:r.length>3?"Check for a coordinated pattern across assets.":"Volume is normal.",c:78}}
if(/summar|today|activity/.test(q)){const c={};A.forEach(a=>c[a.sev]=(c[a.sev]||0)+1);return{r:`${A.length} alerts in 24 h; ${l.length} still active.`,e:Object.entries(c).map(([k,v])=>k+" "+v).join(", ")+`; ${fl} failed logins; score ${score()}/100.`,rec:"Close out resolved items and focus on Critical and High.",c:80}}
return{r:"I can explain an alert, prioritise incidents, show recent changes or summarise today.",e:"Try a suggested prompt.",rec:"Rephrase around one of those.",c:30}}
function ask(q){if(!q.trim())return toast("Type a question");const l=$("log");if(l.querySelector(".empty"))l.innerHTML="";l.insertAdjacentHTML("beforeend",'<div class="q"></div>');l.lastChild.textContent=q;l.insertAdjacentHTML("beforeend",'<div class="a dots" id="ld"><span></span><span></span><span></span></div>');l.scrollTop=1e9;
setTimeout(()=>{const a=answer(q);$("ld").remove();l.insertAdjacentHTML("beforeend",`<dl class="a"><dt>Reason</dt><dd>${a.r}</dd><dt>Evidence</dt><dd>${a.e}</dd><dt>Recommendation</dt><dd>${a.rec}</dd><dt>Confidence</dt><dd>${a.c}%</dd></dl>`);l.scrollTop=1e9},600)}
const go=()=>{clearInterval(timer);timer=setInterval(()=>{tick++;if(tick%3===0){const a=mkAlert(0);A.unshift(a);if(a.sev==="Critical"||a.sev==="High")toast(a.sev+": "+a.t)}render()},3000)};
["q","fs","ft"].forEach(i=>$(i).addEventListener(i==="q"?"input":"change",render));
$("tb").onclick=e=>{const r=e.target.closest("tr[data-i]");if(r)drawer(+r.dataset.i)};$("tb").onkeydown=e=>{if(e.key==="Enter"){const r=e.target.closest("tr[data-i]");if(r)drawer(+r.dataset.i)}};
$("dv").onclick=e=>{const b=e.target.closest("[data-dev]");if(b){const d=DEV[b.dataset.dev];d.on=!d.on;render();toast(d.n+(d.on?" back online":" went offline"))}};
$("inv").onclick=()=>{if(cur){cur.st="investigating";render();toast("Marked investigating");$("dr").close()}};$("rsv").onclick=()=>{if(cur){cur.st="resolved";render();toast("Alert resolved");$("dr").close()}};$("cl").onclick=()=>$("dr").close();
$("dr").addEventListener("click",e=>{if(e.target===$("dr"))$("dr").close()});
$("pause").onclick=()=>{paused=!paused;paused?clearInterval(timer):go();$("pause").textContent=paused?"Resume":"Pause";render()};
$("chips").innerHTML=["Explain this alert.","Which incident should be investigated first?","What changed recently?","Summarize today's security activity."].map(c=>`<button class="b" type="button">${c}</button>`).join("");
$("chips").onclick=e=>{if(e.target.tagName==="BUTTON")ask(e.target.textContent)};$("f").onsubmit=e=>{e.preventDefault();ask($("qi").value);$("qi").value=""};
$("theme").onclick=()=>{const d=document.documentElement,n=d.dataset.theme==="light"?"dark":"light";d.dataset.theme=n;try{localStorage.setItem("cs-theme",n)}catch(e){}};
try{const t=localStorage.getItem("cs-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}
render();go();
</script></body></html>
