<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>UI Template Collection</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f6fa;--card:#fff;--ink:#16203a;--mut:#5d6985;--line:#dfe4f0;--acc:#4f46e5;--acc-2:#eef2ff} @media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1220;--card:#161e33;--ink:#e8ecf8;--mut:#9aa6c4;--line:#27324f;--acc:#8b86ff;--acc-2:#1d2540}} :root[data-theme="dark"]{--bg:#0d1220;--card:#161e33;--ink:#e8ecf8;--mut:#9aa6c4;--line:#27324f;--acc:#8b86ff;--acc-2:#1d2540} html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}*,*:before,*:after{box-sizing:border-box} body{margin:0;height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,sans-serif;overflow:hidden} header{display:flex;align-items:center;gap:12px;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--line)} h1{font-size:16px;margin:0;white-space:nowrap}nav{display:flex;gap:6px;overflow-x:auto;flex:1;padding:2px} nav button{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:6px 14px;cursor:pointer;white-space:nowrap;transition:.15s} nav button:hover{border-color:var(--acc)}nav button[aria-current=true]{background:var(--acc);color:#fff;border-color:var(--acc)} button:focus-visible{outline:3px solid var(--acc);outline-offset:2px} #full{color:var(--acc);font-size:13px;white-space:nowrap;text-decoration:none}#full:hover{text-decoration:underline}iframe{flex:1;width:100%;border:0;background:var(--bg)} @media(max-width:600px){h1{display:none}}
</style></head><body>
<header><h1>UI Collection</h1><nav id="nav" aria-label="Apps"></nav><a id="full" target="_blank" rel="noopener">Open standalone ↗</a></header>
<iframe id="v" title="Selected app" sandbox="allow-scripts allow-same-origin allow-modals"></iframe>
<script>
const TABS=[["researchlens", "ResearchLens", "🔬"], ["cybershield", "CyberShield", "🛡️"], ["careerpilot", "CareerPilot", "🧭"], ["tripmind", "TripMind", "🧳"], ["agrivision", "AgriVision", "🌾"]];
const SRC={
researchlens:"<!DOCTYPE html>\n<html lang=\"en\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>ResearchLens</title>\n<style>body{font-family:system-ui,sans-serif;margin:0;background:#f8fafc;color:#0f172a}</style></head><body><h1>ResearchLens</h1><p>Standalone app loaded successfully.</p></body></html>",
cybershield:"<!DOCTYPE html>\n<html lang=\"en\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>CyberShield</title>\n<style>body{font-family:system-ui,sans-serif;margin:0;background:#0f172a;color:#e2e8f0}</style></head><body><h1>CyberShield</h1><p>Standalone app loaded successfully.</p></body></html>",
careerpilot:"<!DOCTYPE html>\n<html lang=\"en\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>CareerPilot</title>\n<style>body{font-family:system-ui,sans-serif;margin:0;background:#eff6ff;color:#0f172a}</style></head><body><h1>CareerPilot</h1><p>Standalone app loaded successfully.</p></body></html>",
tripmind:"<!DOCTYPE html>\n<html lang=\"en\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>TripMind</title>\n<style>body{font-family:system-ui,sans-serif;margin:0;background:#ecfeff;color:#0f172a}</style></head><body><h1>TripMind</h1><p>Standalone app loaded successfully.</p></body></html>",
agrivision:"<!DOCTYPE html>\n<html lang=\"en\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>AgriVision</title>\n<style>body{font-family:system-ui,sans-serif;margin:0;background:#f0fdf4;color:#14532d}</style></head><body><h1>AgriVision</h1><p>Standalone app loaded successfully.</p></body></html>"
};
const nav=document.getElementById("nav"),v=document.getElementById("v");
nav.innerHTML=TABS.map(t=>`<button data-k="${t[0]}">${t[2]} ${t[1]}</button>`).join("");
function openApp(k){
  if(!SRC[k])k=TABS[0][0];
  v.srcdoc=SRC[k];
  document.title=TABS.find(t=>t[0]===k)[1]+" · UI Collection";
  const appUrl = new URL("./apps/" + k + "/index.html", window.location.href);
  document.getElementById("full").href = appUrl.href;
  nav.querySelectorAll("button").forEach(b=>b.setAttribute("aria-current", b.dataset.k===k));
  try{history.replaceState(null, "", "#" + k)}catch(err){}
}
nav.onclick=e=>{const b=e.target.closest("button"); if(b) openApp(b.dataset.k)};
openApp(location.hash.slice(1));
</script></body></html>
